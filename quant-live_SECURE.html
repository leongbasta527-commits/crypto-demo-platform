<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Quant Live Monitor - Nexora Capital</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d13;color:#eef3f8;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1180px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-weight:900;letter-spacing:.04em}.sub{font-size:11px;color:#74849a;margin-top:5px}.btn{display:inline-block;border:1px solid #2a384a;background:#121b26;color:#dce5ef;border-radius:8px;padding:10px 14px;font-weight:700;text-decoration:none;cursor:pointer}.card{background:#0d141d;border:1px solid #202b38;border-radius:12px;padding:16px;margin-bottom:14px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.health{display:flex;align-items:center;gap:8px;font-size:12px}.dot{width:9px;height:9px;border-radius:50%;background:#657386}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.metric{background:#101923;border:1px solid #1f2b39;border-radius:9px;padding:12px;min-height:78px}.metric small{display:block;color:#718096;font-size:10px;text-transform:uppercase}.metric strong{display:block;margin-top:8px;font-size:17px;word-break:break-word}.wide{grid-column:span 2}.pos{color:#25d695}.neg{color:#f25c69}.wait{color:#f5c86a}.error{padding:18px;color:#ff8e99}.loading{padding:18px;color:#74849a}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.grid{grid-template-columns:1fr}.wide{grid-column:span 1}.wrap{padding:12px}}
</style></head><body><div class="wrap">
<div class="top"><div><div class="brand">NEXORA CAPITAL <span style="font-size:10px;color:#4b92ff">ADMIN</span></div><div class="sub">Quant Engine · Read-only Live Monitor</div></div><a class="btn" href="admin.html">← Back to Admin</a></div>
<div class="card"><div class="head"><div><h2 id="title" style="margin:0;font-size:20px">Live Monitor</h2><div id="subtitle" class="sub">Loading account...</div></div><div class="health"><span id="dot" class="dot"></span><b id="health">LOADING</b></div></div><div id="body" class="loading">Loading live engine data...</div></div>
</div><script>
const MAIN_URL='https://cyvquivolvkxzcseyhvk.supabase.co';
const MAIN_KEY='sb_publishable_dy2_qtfTrOjeD-kPKohHiQ_zKHxZEHU';
const QUANT_AUTH_URL='https://nbdycymxxgywotdmcffp.supabase.co/functions/v1/quant-mt5-auth';
const STRATEGY_ID=1;
const qs=new URLSearchParams(location.search);const accountId=Number(qs.get('account_id'));const uid=String(qs.get('uid')||'').toUpperCase();
let session=null,timer=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function num(v,d=2){const n=Number(v);return Number.isFinite(n)?n.toFixed(d):'—';}
function signed(v){const n=Number(v);return Number.isFinite(n)?(n>0?'+':'')+n.toFixed(2):'—';}
function time(v){if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString();}
function pnl(v){const n=Number(v);return !Number.isFinite(n)?'':n>0?'pos':n<0?'neg':'';}
function box(k,v,cls='',wide=false){return `<div class="metric${wide?' wide':''}"><small>${esc(k)}</small><strong class="${cls}">${v}</strong></div>`;}
function loadSession(){try{const x=JSON.parse(sessionStorage.getItem('adminSession')||'null');if(x?.access_token&&x?.refresh_token){session=x;return true}}catch(_){}return false}
async function refreshSession(){if(!session?.refresh_token)return false;try{const r=await fetch(MAIN_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:MAIN_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});if(!r.ok)return false;const d=await r.json();session={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Date.now()+Number(d.expires_in||3600)*1000,user:d.user};sessionStorage.setItem('adminSession',JSON.stringify(session));return true}catch(_){return false}}
async function call(body){if(!session&& !loadSession())throw new Error('Admin session not found. Open this page from Admin → Quant Access.');if(session.expires_at&&Date.now()>session.expires_at-60000){if(!await refreshSession())throw new Error('Admin session expired. Please log in again.')}const send=()=>fetch(QUANT_AUTH_URL,{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify(body)});let r=await send();if(r.status===401&&await refreshSession())r=await send();let d={};try{d=await r.json()}catch(_){}if(!r.ok||!d?.ok)throw new Error(d?.message||d?.error||('HTTP '+r.status));return d}
function render(x){const age=x.last_heartbeat_at?Math.max(0,Math.floor((Date.now()-new Date(x.last_heartbeat_at).getTime())/1000)):null;const engine=String(x.engine_status||'offline').toUpperCase();const healthy=age!==null&&age<=15;document.getElementById('dot').style.background=healthy?'#25d695':'#f25c69';document.getElementById('health').textContent=healthy?engine:engine+' · STALE';document.getElementById('body').className='';document.getElementById('body').innerHTML=`<div class="grid">${box('Requested',esc(String(x.requested_status||'—').toUpperCase()))}${box('Engine',esc(engine),healthy?'pos':'neg')}${box('Direction',esc(String(x.direction||'—').toUpperCase()))}${box('Re-entry',esc(String(x.reentry_status||'—').toUpperCase()))}${box('Main Positions',esc(x.main_count??'—'))}${box('Main Lot',esc(num(x.main_lot)))}${box('Main P/L',esc(signed(x.main_pl)),pnl(x.main_pl))}${box('Main Protect',esc(String(x.main_protect_status||'—').toUpperCase()))}${box('Hedge Positions',esc(x.hedge_count??'—'))}${box('Hedge Lot',esc(num(x.hedge_lot)))}${box('Hedge P/L',esc(signed(x.hedge_pl)),pnl(x.hedge_pl))}${box('Round Net',esc(signed(x.round_net)),pnl(x.round_net))}${box('Bid',esc(num(x.bid)))}${box('Ask',esc(num(x.ask)))}${box('Spread',esc(num(x.spread)))}${box('EMA Fast',esc(num(x.ema_fast,4)))}${box('EMA Slow',esc(num(x.ema_slow,4)))}${box('EMA Fast Prev',esc(num(x.ema_fast_prev,4)))}${box('Direction Reason',esc(x.direction_reason||'—'),'',true)}${box('Last Heartbeat',esc(time(x.last_heartbeat_at)),'',true)}</div>`}
async function load(){try{const d=await call({action:'admin_quant_live_status',account_id:accountId,customer_uid:uid,strategy_id:STRATEGY_ID});render(d.control)}catch(e){document.getElementById('body').className='error';document.getElementById('body').textContent='Live monitor error: '+(e?.message||e);document.getElementById('health').textContent='ERROR';document.getElementById('dot').style.background='#f25c69'}}
async function startSecureMonitor(){
  if(!loadSession()){
    const next='quant-live.html'+location.search;
    location.replace('admin.html?next='+encodeURIComponent(next));
    return;
  }
  if(!Number.isInteger(accountId)||accountId<1){
    document.getElementById('body').className='error';
    document.getElementById('body').textContent='Invalid account_id.';
    return;
  }
  document.getElementById('title').textContent='Account #'+accountId+' · Live Engine Monitor';
  document.getElementById('subtitle').textContent=(uid||'Unknown UID')+' · Gold Quant · READ ONLY';
  await load();
  timer=setInterval(load,2000);
}
startSecureMonitor();
</script></body></html>
