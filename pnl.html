<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>P&L Calendar</title>
<style>
:root{--bg:#090d12;--card:#111820;--line:#202a35;--text:#eef3f8;--muted:#7f8b99;--green:#20c997;--red:#ff5b68}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;padding-bottom:82px}
.wrap{max-width:760px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.back{color:#aeb9c5;text-decoration:none;font-size:28px;width:36px}.title{font-weight:800;font-size:17px}.badge{font-size:10px;color:#8b98a7;border:1px solid #293440;padding:5px 8px;border-radius:8px}
.summary{background:linear-gradient(145deg,#121a23,#0e141b);border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:13px}
.summary small{color:var(--muted)}#totalPnl{font-size:28px;font-weight:850;margin-top:7px}.positive{color:var(--green)!important}.negative{color:var(--red)!important}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:15px}.stat{background:#0b1117;border:1px solid #1e2934;border-radius:10px;padding:10px}.stat span{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.stat b{font-size:12px}
.cal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.monthbar button{width:36px;height:34px;border:1px solid #293541;border-radius:9px;background:#151e27;color:#cbd4de;font-size:19px;cursor:pointer}.month{font-size:15px;font-weight:800}
.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week div{text-align:center;color:#687585;font-size:10px;padding:5px 0}
.day{min-height:82px;border:1px solid #202a34;border-radius:9px;background:#0c1218;padding:7px;overflow:hidden}.day.empty{opacity:.2}.day.today{border-color:#526171}.num{font-size:11px;font-weight:800;color:#aeb8c3}.net{font-size:11px;font-weight:800;margin-top:8px}.mini{font-size:8px;color:#657281;margin-top:4px;line-height:1.35}
.loading,.error{text-align:center;color:var(--muted);font-size:12px;padding:16px}.error{color:#ff7b85}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:62px;background:rgba(10,14,19,.96);border-top:1px solid #202832;display:flex;z-index:50}.bottom-nav a{flex:1;display:grid;place-items:center;text-decoration:none;color:#788594;font-size:11px}.bottom-nav a.active{color:#fff;font-weight:800}
@media(max-width:520px){.wrap{padding:12px}.day{min-height:72px;padding:5px}.mini{font-size:7px}.net{font-size:9px}.stats{gap:5px}.stat{padding:8px}}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><a class="back" href="assets.html">‹</a><div class="title">P&L Calendar</div><div class="badge">DEMO</div></div>
 <section class="summary">
  <small>Monthly Total P&L</small><div id="totalPnl">0.00 USDT</div>
  <div class="stats"><div class="stat"><span>Profit</span><b id="profit">0.00</b></div><div class="stat"><span>Loss</span><b id="loss">0.00</b></div><div class="stat"><span>Settled Trades</span><b id="trades">0</b></div></div>
 </section>
 <section class="cal">
  <div class="monthbar"><button id="prev">‹</button><div id="month" class="month"></div><button id="next">›</button></div>
  <div class="week"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
  <div id="grid" class="grid"></div><div id="status" class="loading">Loading P&L...</div>
 </section>
</div>
<nav class="bottom-nav"><a href="index.html">Markets</a><a href="trading.html?symbol=BTC">Trading</a><a href="assets.html">Assets</a><a href="profile.html">Profile</a></nav>
<script>
const SUPABASE_URL='https://cyvquivolvkxzcseyhvk.supabase.co';
const SUPABASE_KEY='sb_publishable_dy2_qtfTrOjeD-kPKohHiQ_zKHxZEHU';
let view=new Date(); view=new Date(view.getFullYear(),view.getMonth(),1);

function uid(){let v=localStorage.getItem('demoUid');if(!v){v='DEMO-'+Math.floor(100000+Math.random()*900000);localStorage.setItem('demoUid',v)}return v}
function fmt(n){return Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function localKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pnlOf(x){
 const p=Number(x.profit_loss);
 if(Number.isFinite(p)) return p;
 if(x.result==='WIN') return Number(x.amount||0)*Number(x.payout_rate||.8);
 if(x.result==='LOSS') return -Number(x.amount||0);
 return 0;
}
async function load(){
 const y=view.getFullYear(),m=view.getMonth();
 document.getElementById('month').textContent=view.toLocaleString(undefined,{month:'long',year:'numeric'});
 document.getElementById('status').style.display='block'; document.getElementById('status').textContent='Loading P&L...';
 try{
  const start=new Date(y,m,1); const end=new Date(y,m+1,1);
  const url=SUPABASE_URL+'/rest/v1/trade_orders?select=id,amount,payout_rate,result,profit_loss,status,settled_at&uid=eq.'+encodeURIComponent(uid())+
   '&status=eq.settled&settled_at=gte.'+encodeURIComponent(start.toISOString())+'&settled_at=lt.'+encodeURIComponent(end.toISOString())+'&order=settled_at.asc';
  const r=await fetch(url,{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY},cache:'no-store'});
  if(!r.ok) throw new Error('Unable to load trade history');
  render(await r.json());
  document.getElementById('status').style.display='none';
 }catch(e){document.getElementById('status').className='error';document.getElementById('status').textContent=e.message}
}
function render(rows){
 const y=view.getFullYear(),m=view.getMonth(),days=new Date(y,m+1,0).getDate(),first=new Date(y,m,1).getDay();
 const map={}; let profit=0,loss=0,total=0;
 rows.forEach(x=>{if(!x.settled_at)return;let d=new Date(x.settled_at),k=localKey(d),p=pnlOf(x);if(!map[k])map[k]={profit:0,loss:0,net:0,count:0};map[k].count++;map[k].net+=p;total+=p;if(p>0){map[k].profit+=p;profit+=p}else if(p<0){map[k].loss+=Math.abs(p);loss+=Math.abs(p)}});
 const grid=document.getElementById('grid');grid.innerHTML='';
 for(let i=0;i<first;i++){let e=document.createElement('div');e.className='day empty';grid.appendChild(e)}
 const today=localKey(new Date());
 for(let n=1;n<=days;n++){
  const d=new Date(y,m,n),k=localKey(d),x=map[k]||{profit:0,loss:0,net:0,count:0},el=document.createElement('div');
  el.className='day'+(k===today?' today':'');
  const cls=x.net>0?'positive':x.net<0?'negative':'';
  el.innerHTML='<div class="num">'+n+'</div><div class="net '+cls+'">'+(x.count?(x.net>=0?'+':'')+fmt(x.net):'—')+'</div>'+
   (x.count?'<div class="mini">P +'+fmt(x.profit)+'<br>L -'+fmt(x.loss)+'<br>'+x.count+' trade'+(x.count>1?'s':'')+'</div>':'');
  grid.appendChild(el);
 }
 const t=document.getElementById('totalPnl');t.textContent=(total>0?'+':'')+fmt(total)+' USDT';t.className=total>0?'positive':total<0?'negative':'';
 document.getElementById('profit').textContent='+'+fmt(profit)+' USDT';document.getElementById('profit').className='positive';
 document.getElementById('loss').textContent='-'+fmt(loss)+' USDT';document.getElementById('loss').className='negative';
 document.getElementById('trades').textContent=rows.length;
}
document.getElementById('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);load()};
document.getElementById('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);load()};
load();
</script>
<script src="floating-widget.js"></script>
</body></html>
