<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Trading Demo</title>

<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080d13;
    color: #eef3f8;
    font-family: Arial, Helvetica, sans-serif;
    padding-bottom: 74px;
}

.header {
    background: #0d141d;
    padding: 16px 18px 18px;
    border-bottom: 1px solid #202b38;
}

.header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.pair-area {
    display: flex;
    align-items: center;
    gap: 8px;
}

.pair-name {
    font-size: 22px;
    font-weight: 700;
}

.demo-tag {
    padding: 4px 7px;
    border-radius: 5px;
    background: #243348;
    color: #8fb9ff;
    font-size: 10px;
}

.favorite-btn {
    width: 42px;
    height: 42px;
    border: 1px solid #2b3948;
    border-radius: 8px;
    background: #111923;
    color: #9ba8ba;
    font-size: 24px;
    cursor: pointer;
}

.favorite-btn.active {
    color: #ffd43b;
}

.market-overview {
    margin-top: 18px;
    display: grid;
    grid-template-columns: 1.15fr .85fr;
    gap: 28px;
    align-items: center;
}

.latest-label,
.mark-row,
.feed-status,
.market-stat-label {
    color: #758398;
    font-size: 12px;
}

.price-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
}

.price {
    font-size: 46px;
    line-height: 1;
    font-weight: 700;
    color: #24d79a;
}

.price.red,
.change24.red {
    color: #f25b68;
}

.change24 {
    font-size: 20px;
    color: #24d79a;
}

.mark-row {
    margin-top: 9px;
}

.mark-row span {
    color: #a7b1bf;
}

.feed-status {
    margin-top: 7px;
    font-size: 10px;
}

.status-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #f2b742;
    margin-right: 5px;
}

.status-dot.online {
    background: #24d79a;
}

.status-dot.error {
    background: #f25b68;
}

.market-stats {
    display: grid;
    gap: 10px;
}

.market-stat {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 18px;
}

.market-stat-value {
    font-size: 16px;
    text-align: right;
}

.box {
    margin: 13px;
    border: 1px solid #202b37;
    border-radius: 8px;
    background: #0e161f;
}

.balance-box {
    padding: 14px;
}

.balance-label {
    font-size: 11px;
    color: #718095;
}

.balance {
    margin-top: 5px;
    font-size: 23px;
    font-weight: 700;
}

.chart-box {
    position: relative;
    height: 440px;
    overflow: hidden;
    background: #0c1219;
}

.kline-timeframes {
    height: 44px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    overflow-x: auto;
    border-bottom: 1px solid #202b37;
    background: #0d141d;
}

.kline-timeframes button {
    flex: 0 0 auto;
    min-width: 43px;
    height: 30px;
    padding: 0 9px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    color: #8290a3;
    cursor: pointer;
}

.kline-timeframes button.active {
    color: #57a8ff;
    background: #14243a;
    border-color: #294a6e;
}

.indicator-btn {
    min-width: 78px !important;
    border-color: #2b3d52 !important;
    background: #111b27 !important;
}

.indicator-btn.active {
    color: #57a8ff !important;
    border-color: #315c8d !important;
    background: #13243a !important;
}

#klineChart {
    width: 100%;
    height: calc(100% - 44px);
}

#chartLoading {
    position: absolute;
    inset: 44px 0 0 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #7890ad;
    font-size: 12px;
    pointer-events: none;
}

.chart-tools {
    position: absolute;
    left: 7px;
    top: 54px;
    z-index: 12;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 5px;
    border: 1px solid #263240;
    border-radius: 8px;
    background: rgba(13,20,29,.95);
}

.chart-tool {
    width: 30px;
    height: 30px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    color: #a3afbe;
    cursor: pointer;
}

.chart-tool.active,
.chart-tool:hover {
    background: #182332;
    border-color: #33465d;
    color: #fff;
}

#drawingCanvas {
    position: absolute;
    left: 0;
    top: 44px;
    width: 100%;
    height: calc(100% - 44px);
    z-index: 9;
    pointer-events: none;
    touch-action: none;
}

.drawing-hint {
    position: absolute;
    left: 50px;
    top: 53px;
    z-index: 11;
    display: none;
    padding: 5px 8px;
    border-radius: 5px;
    background: rgba(12,18,25,.9);
    font-size: 10px;
    color: #aab7c7;
}

.trade-box {
    padding: 14px;
}

.section-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 14px;
}

.field {
    margin-bottom: 12px;
}

.field label {
    display: block;
    font-size: 11px;
    color: #718095;
    margin-bottom: 6px;
}

.input,
.select {
    width: 100%;
    height: 44px;
    border: 1px solid #2b3948;
    border-radius: 7px;
    background: #101923;
    color: #fff;
    padding: 0 12px;
    outline: none;
}

.quick-row {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 6px;
    margin-bottom: 14px;
}

.quick-row button {
    height: 36px;
    border: 1px solid #2b3948;
    border-radius: 6px;
    background: #101923;
    color: #9ed1ff;
    cursor: pointer;
}

.trade-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.trade-actions button {
    height: 48px;
    border: 0;
    border-radius: 8px;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
}

.up-btn {
    background: #169b70;
}

.down-btn {
    background: #d84f5c;
}

.order-status {
    margin-top: 12px;
    padding: 10px;
    border-radius: 7px;
    background: #0b1219;
    color: #aab7c7;
    font-size: 12px;
    display: none;
}

.history {
    padding: 14px;
}

.history-row {
    display: grid;
    grid-template-columns: 1fr auto auto auto;
    gap: 8px;
    padding: 9px 0;
    border-bottom: 1px solid #1c2733;
    font-size: 12px;
}

.win {
    color: #24d79a;
}

.loss {
    color: #f25b68;
}

.draw {
    color: #d3a94a;
}

.bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 64px;
    background: #0d141d;
    border-top: 1px solid #202b38;
    display: grid;
    grid-template-columns: repeat(4,1fr);
    z-index: 50;
}

.bottom-nav a {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8290a3;
    text-decoration: none;
    font-size: 12px;
}

.bottom-nav a.active {
    color: #409cff;
}

@media(max-width:650px) {
    .market-overview {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .price {
        font-size: 34px;
    }

    .change24 {
        font-size: 15px;
    }

    .market-stat-value {
        font-size: 13px;
    }

    .chart-box {
        height: 390px;
    }

    .quick-row {
        grid-template-columns: repeat(2,1fr);
    }
}
</style>
</head>

<script>

const params =
    new URLSearchParams(
        location.search
    );

const selectedSymbol =
    (
        params.get(
            "symbol"
        ) ||
        "BTC"
    ).toUpperCase();


const supported = [
    "BTC",
    "ETH",
    "BNB",
    "SOL",
    "XRP",
    "DOGE",
    "ADA",
    "TRX",
    "AVAX",
    "LINK",
    "DOT",
    "BCH",
    "LTC",
    "UNI",
    "XLM",
    "TON",
    "SHIB",
    "HBAR",
    "SUI",
    "APT",
    "NEAR",
    "ICP",
    "ETC",
    "FIL",
    "ATOM",
    "ARB",
    "OP",
    "AAVE",
    "PEPE",
    "POL"
];


const symbol =
    supported.includes(
        selectedSymbol
    )
        ? selectedSymbol
        : "BTC";


document.getElementById(
    "pairName"
).textContent =
    symbol +
    " / USDT";


let balance =
    Number(
        localStorage.getItem(
            "demoBalance"
        )
    );


if (
    !Number.isFinite(
        balance
    )
) {
    balance =
        10000;
}


let currentPrice =
    null;

let lastPrice =
    null;

let chart =
    null;

let candleSeries =
    null;

let klineSocket =
    null;

let tradeSocket =
    null;

let tickerSocket =
    null;

let candleData =
    [];


let currentInterval =
    localStorage.getItem(
        "klineInterval"
    ) ||
    "15m";


const intervals = {
    "1m": "1m",
    "5m": "5m",
    "15m": "15m",
    "30m": "30m",
    "1h": "1h",
    "4h": "4h",
    "1d": "1d"
};


function fmtPrice(
    value
) {

    const v =
        Number(
            value
        );

    if (
        !Number.isFinite(
            v
        )
    ) {
        return "--";
    }

    if (
        v >= 1000
    ) {

        return v.toLocaleString(
            undefined,
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );

    }

    if (
        v >= 1
    ) {

        return v.toLocaleString(
            undefined,
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 4
            }
        );

    }

    return v.toPrecision(
        6
    );

}


function fmtVol(
    value
) {

    const v =
        Number(
            value
        );

    if (
        !Number.isFinite(
            v
        )
    ) {
        return "--";
    }

    if (
        v >= 1000000000
    ) {
        return (
            v /
            1000000000
        ).toFixed(
            2
        ) + "B";
    }

    if (
        v >= 1000000
    ) {
        return (
            v /
            1000000
        ).toFixed(
            2
        ) + "M";
    }

    if (
        v >= 1000
    ) {
        return (
            v /
            1000
        ).toFixed(
            2
        ) + "K";
    }

    return v.toFixed(
        2
    );

}


function saveBalance() {

    localStorage.setItem(
        "demoBalance",
        String(
            balance
        )
    );

    document.getElementById(
        "balance"
    ).textContent =
        balance.toFixed(
            2
        ) +
        " USDT";

}


saveBalance();


function updatePrice(
    price
) {

    const p =
        Number(
            price
        );

    if (
        !Number.isFinite(
            p
        ) ||
        p <= 0
    ) {
        return;
    }


    lastPrice =
        currentPrice;

    currentPrice =
        p;


    const element =
        document.getElementById(
            "price"
        );

    element.textContent =
        fmtPrice(
            p
        );


    element.classList.toggle(
        "red",
        lastPrice !== null &&
        p < lastPrice
    );


    document.getElementById(
        "markPrice"
    ).textContent =
        fmtPrice(
            p
        );


    document.getElementById(
        "connectionDot"
    ).className =
        "status-dot online";


    document.getElementById(
        "connectionText"
    ).textContent =
        "Live";

}


function update24(
    high,
    low,
    volume,
    percent
) {

    document.getElementById(
        "high24h"
    ).textContent =
        fmtPrice(
            high
        );


    document.getElementById(
        "low24h"
    ).textContent =
        fmtPrice(
            low
        );


    document.getElementById(
        "volume24h"
    ).textContent =
        fmtVol(
            volume
        );


    const change =
        document.getElementById(
            "change24h"
        );


    const pct =
        Number(
            percent
        );


    if (
        Number.isFinite(
            pct
        )
    ) {

        change.textContent =
            (
                pct >= 0
                    ? "+"
                    : ""
            ) +
            pct.toFixed(
                2
            ) +
            "%";


        change.classList.toggle(
            "red",
            pct < 0
        );

    }

}


function connectPrice() {

    if (
        tradeSocket
    ) {

        try {
            tradeSocket.close();
        } catch (error) {}

    }


    tradeSocket =
        new WebSocket(
            "wss://stream.binance.com:9443/ws/" +
            symbol.toLowerCase() +
            "usdt@trade"
        );


    tradeSocket.onmessage =
        function (event) {

            try {

                const data =
                    JSON.parse(
                        event.data
                    );

                updatePrice(
                    data.p
                );

            } catch (error) {}

        };


    tradeSocket.onclose =
        function () {

            setTimeout(
                connectPrice,
                2500
            );

        };


    tradeSocket.onerror =
        function () {

            try {
                tradeSocket.close();
            } catch (error) {}

        };

}


function connect24() {

    if (
        tickerSocket
    ) {

        try {
            tickerSocket.close();
        } catch (error) {}

    }


    tickerSocket =
        new WebSocket(
            "wss://stream.binance.com:9443/ws/" +
            symbol.toLowerCase() +
            "usdt@ticker"
        );


    tickerSocket.onmessage =
        function (event) {

            try {

                const data =
                    JSON.parse(
                        event.data
                    );


                update24(
                    data.h,
                    data.l,
                    data.q,
                    data.P
                );


                if (
                    !currentPrice
                ) {

                    updatePrice(
                        data.c
                    );

                }

            } catch (error) {}

        };


    tickerSocket.onclose =
        function () {

            setTimeout(
                connect24,
                2500
            );

        };


    tickerSocket.onerror =
        function () {

            try {
                tickerSocket.close();
            } catch (error) {}

        };

}


async function restPriceFallback() {

    try {

        const response =
            await fetch(
                "https://data-api.binance.vision/api/v3/ticker/price?symbol=" +
                symbol +
                "USDT",
                {
                    cache:
                        "no-store"
                }
            );


        const data =
            await response.json();


        updatePrice(
            data.price
        );

    } catch (error) {}

}


function createChart() {

    const host =
        document.getElementById(
            "klineChart"
        );


    chart =
        LightweightCharts.createChart(
            host,
            {
                width:
                    host.clientWidth,

                height:
                    host.clientHeight,

                layout: {
                    background: {
                        type:
                            "solid",

                        color:
                            "#0c1219"
                    },

                    textColor:
                        "#7f8c9d"
                },

                grid: {
                    vertLines: {
                        color:
                            "#18232e"
                    },

                    horzLines: {
                        color:
                            "#18232e"
                    }
                },

                rightPriceScale: {
                    borderColor:
                        "#27313c"
                },

                timeScale: {
                    borderColor:
                        "#27313c",

                    timeVisible:
                        true,

                    secondsVisible:
                        false,

                    barSpacing:
                        8,

                    minBarSpacing:
                        5,

                    rightOffset:
                        4
                },

                crosshair: {
                    mode:
                        LightweightCharts
                            .CrosshairMode
                            .Normal
                }
            }
        );


    candleSeries =
        chart.addCandlestickSeries(
            {
                upColor:
                    "#24d79a",

                downColor:
                    "#f25b68",

                borderUpColor:
                    "#24d79a",

                borderDownColor:
                    "#f25b68",

                wickUpColor:
                    "#24d79a",

                wickDownColor:
                    "#f25b68"
            }
        );


    new ResizeObserver(
        function () {

            chart.applyOptions({
                width:
                    host.clientWidth,

                height:
                    host.clientHeight
            });

            resizeCanvas();

        }
    ).observe(
        host
    );

}


async function fetchKlines() {

    const query =
        "?symbol=" +
        symbol +
        "USDT" +
        "&interval=" +
        intervals[
            currentInterval
        ] +
        "&limit=300";


    const hosts = [

        "https://data-api.binance.vision/api/v3/klines",

        "https://api.binance.com/api/v3/klines",

        "https://api1.binance.com/api/v3/klines",

        "https://api2.binance.com/api/v3/klines",

        "https://api3.binance.com/api/v3/klines"

    ];


    for (
        const host
        of hosts
    ) {

        try {

            const controller =
                new AbortController();


            const timeout =
                setTimeout(
                    function () {

                        controller.abort();

                    },
                    4500
                );


            const response =
                await fetch(
                    host +
                    query,
                    {
                        cache:
                            "no-store",

                        signal:
                            controller.signal
                    }
                );


            clearTimeout(
                timeout
            );


            if (
                !response.ok
            ) {
                continue;
            }


            const raw =
                await response.json();


            const candles =
                raw.map(
                    function (item) {

                        return {
                            time:
                                Math.floor(
                                    Number(
                                        item[0]
                                    ) /
                                    1000
                                ),

                            open:
                                Number(
                                    item[1]
                                ),

                            high:
                                Number(
                                    item[2]
                                ),

                            low:
                                Number(
                                    item[3]
                                ),

                            close:
                                Number(
                                    item[4]
                                )
                        };

                    }
                ).filter(
                    function (item) {

                        return (
                            Number.isFinite(
                                item.close
                            ) &&
                            item.close >
                                0
                        );

                    }
                );


            if (
                candles.length
            ) {

                localStorage.setItem(
                    "klineCache_" +
                    symbol +
                    "_" +
                    currentInterval,
                    JSON.stringify(
                        candles
                    )
                );


                return candles;

            }

        } catch (error) {}

    }


    try {

        return JSON.parse(
            localStorage.getItem(
                "klineCache_" +
                symbol +
                "_" +
                currentInterval
            ) ||
            "[]"
        );

    } catch (error) {

        return [];

    }

}


async function loadKlines() {

    const loading =
        document.getElementById(
            "chartLoading"
        );


    loading.style.display =
        "flex";


    loading.textContent =
        "Loading K-line chart...";


    const data =
        await fetchKlines();


    if (
        data.length
    ) {

        candleData =
            data;


        candleSeries.setData(
            data
        );


        chart
            .timeScale()
            .setVisibleLogicalRange(
                {
                    from:
                        Math.max(
                            0,
                            data.length -
                            72
                        ),

                    to:
                        data.length +
                        3
                }
            );


        loading.style.display =
            "none";


        refreshIndicators();

    } else {

        loading.textContent =
            "Historical K-line unavailable — realtime price still connected";

    }

}


function connectKline() {

    if (
        klineSocket
    ) {

        try {
            klineSocket.close();
        } catch (error) {}

    }


    klineSocket =
        new WebSocket(
            "wss://stream.binance.com:9443/ws/" +
            symbol.toLowerCase() +
            "usdt@kline_" +
            intervals[
                currentInterval
            ]
        );


    klineSocket.onmessage =
        function (event) {

            try {

                const data =
                    JSON.parse(
                        event.data
                    );


                const kline =
                    data.k;


                const candle = {
                    time:
                        Math.floor(
                            Number(
                                kline.t
                            ) /
                            1000
                        ),

                    open:
                        Number(
                            kline.o
                        ),

                    high:
                        Number(
                            kline.h
                        ),

                    low:
                        Number(
                            kline.l
                        ),

                    close:
                        Number(
                            kline.c
                        )
                };


                candleSeries.update(
                    candle
                );


                updateLiveCandleData(
                    candle
                );


                updatePrice(
                    candle.close
                );


                redraw();

            } catch (error) {}

        };


    klineSocket.onclose =
        function () {

            setTimeout(
                connectKline,
                2500
            );

        };


    klineSocket.onerror =
        function () {

            try {
                klineSocket.close();
            } catch (error) {}

        };

}


function updateLiveCandleData(
    candle
) {

    const index =
        candleData.length -
        1;


    if (
        index >= 0 &&
        candleData[
            index
        ].time ===
        candle.time
    ) {

        candleData[
            index
        ] =
            candle;

    } else if (
        index < 0 ||
        candle.time >
        candleData[
            index
        ].time
    ) {

        candleData.push(
            candle
        );


        if (
            candleData.length >
            300
        ) {

            candleData.shift();

        }

    }


    if (
        indicatorsEnabled
    ) {

        refreshIndicators();

    }

}

let sma20 =

let indicatorsEnabled =

function sma(
    period
) {

    const result =
        [];

    let sum =
        0;


    for (
        let i = 0;
        i <
        candleData.length;
        i++
    ) {

        sum +=
            candleData[
                i
            ].close;


        if (
            i >=
            period
        ) {

            sum -=
                candleData[
                    i -
                    period
                ].close;

        }


        if (
            i >=
            period -
            1
        ) {

            result.push(
                {
                    time:
                        candleData[
                            i
                        ].time,

                    value:
                        sum /
                        period
                }
            );

        }

    }


    return result;

}

const canvas =
    document.getElementById(
        "drawingCanvas"
    );


const ctx =
    canvas.getContext(
        "2d"
    );


const hint =
    document.getElementById(
        "drawingHint"
    );


let tool =
    "cursor";

let startPoint =
    null;

let preview =
    null;

let drawings =

function resizeCanvas() {

    const rect =
        document.getElementById(
            "klineChart"
        ).getBoundingClientRect();


    const ratio =
        devicePixelRatio ||
        1;


    canvas.width =
        Math.max(
            1,
            Math.round(
                rect.width *
                ratio
            )
        );


    canvas.height =
        Math.max(
            1,
            Math.round(
                rect.height *
                ratio
            )
        );


    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );


    redraw();

}


function eventPoint(
    event
) {

    const rect =
        canvas.getBoundingClientRect();


    const x =
        event.clientX -
        rect.left;


    const y =
        event.clientY -
        rect.top;


    const time =
        chart
            .timeScale()
            .coordinateToTime(
                x
            );


    const price =
        candleSeries
            .coordinateToPrice(
                y
            );


    if (
        time === null ||
        !Number.isFinite(
            Number(
                price
            )
        )
    ) {

        return null;

    }


    return {
        time:
            typeof time ===
            "number"
                ? time
                : null,

        price:
            Number(
                price
            )
    };

}


function coord(
    point
) {

    if (
        !point ||
        point.time ===
        null
    ) {
        return null;
    }


    const x =
        chart
            .timeScale()
            .timeToCoordinate(
                point.time
            );


    const y =
        candleSeries
            .priceToCoordinate(
                point.price
            );


    if (
        x === null ||
        y === null
    ) {
        return null;
    }


    return {
        x,
        y
    };

}


function drawOne(
    drawing,
    ghost =
        false
) {

    ctx.save();


    ctx.strokeStyle =
        ghost
            ? "rgba(113,179,255,.7)"
            : "#5baeff";


    ctx.fillStyle =
        "rgba(91,174,255,.12)";


    ctx.lineWidth =
        ghost
            ? 1
            : 1.4;


    ctx.font =
        "12px Arial";


    if (
        drawing.type ===
        "horizontal"
    ) {

        const y =
            candleSeries
                .priceToCoordinate(
                    drawing.price
                );


        if (
            y !== null
        ) {

            ctx.setLineDash(
                [5,4]
            );

            ctx.beginPath();

            ctx.moveTo(
                0,
                y
            );

            ctx.lineTo(
                canvas.clientWidth,
                y
            );

            ctx.stroke();

        }


        ctx.restore();

        return;

    }


    if (
        drawing.type ===
        "vertical"
    ) {

        const x =
            chart
                .timeScale()
                .timeToCoordinate(
                    drawing.time
                );


        if (
            x !== null
        ) {

            ctx.setLineDash(
                [5,4]
            );

            ctx.beginPath();

            ctx.moveTo(
                x,
                0
            );

            ctx.lineTo(
                x,
                canvas.clientHeight
            );

            ctx.stroke();

        }


        ctx.restore();

        return;

    }


    const a =
        coord(
            drawing.a
        );


    const b =
        coord(
            drawing.b
        );


    if (
        drawing.type ===
        "text"
    ) {

        if (
            a
        ) {

            ctx.fillStyle =
                "#dce6f3";


            ctx.fillText(
                drawing.text,
                a.x +
                4,
                a.y -
                6
            );

        }


        ctx.restore();

        return;

    }


    if (
        !a ||
        !b
    ) {

        ctx.restore();

        return;

    }


    if (
        drawing.type ===
        "trend"
    ) {

        ctx.beginPath();

        ctx.moveTo(
            a.x,
            a.y
        );

        ctx.lineTo(
            b.x,
            b.y
        );

        ctx.stroke();

    }


    if (
        drawing.type ===
        "rectangle"
    ) {

        const x =
            Math.min(
                a.x,
                b.x
            );


        const y =
            Math.min(
                a.y,
                b.y
            );


        const width =
            Math.abs(
                b.x -
                a.x
            );


        const height =
            Math.abs(
                b.y -
                a.y
            );


        ctx.fillRect(
            x,
            y,
            width,
            height
        );


        ctx.strokeRect(
            x,
            y,
            width,
            height
        );

    }


    if (
        drawing.type ===
        "ruler"
    ) {

        ctx.setLineDash(
            [4,3]
        );


        ctx.beginPath();

        ctx.moveTo(
            a.x,
            a.y
        );

        ctx.lineTo(
            b.x,
            b.y
        );

        ctx.stroke();


        const change =
            drawing.b.price -
            drawing.a.price;


        const percent =
            drawing.a.price
                ? change /
                    drawing.a.price *
                    100
                : 0;


        const label =
            (
                change >= 0
                    ? "+"
                    : ""
            ) +
            change.toFixed(
                2
            ) +
            " (" +
            (
                percent >= 0
                    ? "+"
                    : ""
            ) +
            percent.toFixed(
                2
            ) +
            "%)";


        const midX =
            (
                a.x +
                b.x
            ) /
            2;


        const midY =
            (
                a.y +
                b.y
            ) /
            2;


        ctx.setLineDash(
            []
        );


        ctx.fillStyle =
            "rgba(12,18,25,.9)";


        ctx.fillRect(
            midX -
            55,
            midY -
            20,
            110,
            18
        );


        ctx.fillStyle =
            "#fff";


        ctx.textAlign =
            "center";


        ctx.fillText(
            label,
            midX,
            midY -
            7
        );

    }


    ctx.restore();

}


function redraw() {

    ctx.clearRect(
        0,
        0,
        canvas.clientWidth,
        canvas.clientHeight
    );


    drawings.forEach(
        function (drawing) {

            drawOne(
                drawing
            );

        }
    );


    if (
        preview
    ) {

        drawOne(
            preview,
            true
        );

    }

}


function setTool(
    value
) {

    if (
        value ===
        "clear"
    ) {

        drawings =
            [];

        preview =
            null;

        startPoint =
            null;


        setTool(
            "cursor"
        );


        redraw();

        return;

    }


    tool =
        value;


    startPoint =
        null;


    preview =
        null;


    document
        .querySelectorAll(
            ".chart-tool"
        )
        .forEach(
            function (button) {

                button.classList.toggle(
                    "active",
                    button.dataset.tool ===
                    value
                );

            }
        );


    canvas.style.pointerEvents =
        value ===
        "cursor"
            ? "none"
            : "auto";


    canvas.style.cursor =
        value ===
        "cursor"
            ? "default"
            : "crosshair";


    hint.style.display =
        value ===
        "cursor"
            ? "none"
            : "block";


    hint.textContent =
        [
            "trend",
            "rectangle",
            "ruler"
        ].includes(
            value
        )
            ? "Select two points"
            : value ===
                "text"
                ? "Tap chart to add text"
                : "Tap chart to place";


    redraw();

}


document
    .querySelectorAll(
        ".chart-tool"
    )
    .forEach(
        function (button) {

            button.onclick =
                function () {

                    setTool(
                        button.dataset.tool
                    );

                };

        }
    );


canvas.addEventListener(
    "pointerdown",
    function (event) {

        if (
            tool ===
            "cursor"
        ) {
            return;
        }


        const point =
            eventPoint(
                event
            );


        if (
            !point ||
            point.time ===
            null
        ) {
            return;
        }


        if (
            tool ===
            "horizontal"
        ) {

            drawings.push(
                {
                    type:
                        "horizontal",

                    price:
                        point.price
                }
            );


            redraw();

            return;

        }


        if (
            tool ===
            "vertical"
        ) {

            drawings.push(
                {
                    type:
                        "vertical",

                    time:
                        point.time
                }
            );


            redraw();

            return;

        }


        if (
            tool ===
            "text"
        ) {

            const text =
                prompt(
                    "Text:",
                    ""
                );


            if (
                text &&
                text.trim()
            ) {

                drawings.push(
                    {
                        type:
                            "text",

                        a:
                            point,

                        b:
                            point,

                        text:
                            text.trim()
                    }
                );


                redraw();

            }


            return;

        }


        if (
            !startPoint
        ) {

            startPoint =
                point;


            preview = {
                type:
                    tool,

                a:
                    point,

                b:
                    point
            };


            redraw();

            return;

        }


        drawings.push(
            {
                type:
                    tool,

                a:
                    startPoint,

                b:
                    point
            }
        );


        startPoint =
            null;


        preview =
            null;


        redraw();

    }
);


canvas.addEventListener(
    "pointermove",
    function (event) {

        if (
            !startPoint ||
            ![
                "trend",
                "rectangle",
                "ruler"
            ].includes(
                tool
            )
        ) {
            return;
        }


        const point =
            eventPoint(
                event
            );


        if (
            point
        ) {

            preview = {
                type:
                    tool,

                a:
                    startPoint,

                b:
                    point
            };


            redraw();

        }

    }
);

let activeOrder =

function placeOrder(
    side
) {

    if (
        activeOrder
    ) {

        alert(
            "已有订单进行中"
        );

        return;

    }


    const amount =
        Number(
            document.getElementById(
                "amount"
            ).value
        );


    const duration =
        Number(
            document.getElementById(
                "duration"
            ).value
        );


    if (
        !currentPrice
    ) {

        alert(
            "价格还没加载"
        );

        return;

    }


    if (
        !Number.isFinite(
            amount
        ) ||
        amount <= 0
    ) {

        alert(
            "请输入正确金额"
        );

        return;

    }


    if (
        amount >
        balance
    ) {

        alert(
            "Demo Balance 不足"
        );

        return;

    }


    balance -=
        amount;


    saveBalance();


    const entry =
        currentPrice;


    const end =
        Date.now() +
        duration *
        1000;


    activeOrder = {
        side,
        amount,
        duration,
        entry,
        end
    };


    const box =
        document.getElementById(
            "orderStatus"
        );


    box.style.display =
        "block";


    const timer =
        setInterval(
            function () {

                const left =
                    Math.max(
                        0,
                        Math.ceil(
                            (
                                end -
                                Date.now()
                            ) /
                            1000
                        )
                    );


                box.textContent =
                    side +
                    " | Entry " +
                    fmtPrice(
                        entry
                    ) +
                    " | " +
                    left +
                    "s";


                if (
                    left <=
                    0
                ) {

                    clearInterval(
                        timer
                    );


                    finishOrder();

                }

            },
            250
        );

}


function finishOrder() {

    if (
        !activeOrder
    ) {
        return;
    }


    const order =
        activeOrder;


    const exit =
        currentPrice ||
        order.entry;


    let result =
        "DRAW";


    let pnl =
        0;


    if (
        order.side ===
        "UP"
    ) {

        if (
            exit >
            order.entry
        ) {

            result =
                "WIN";

            pnl =
                order.amount *
                0.8;

        } else if (
            exit <
            order.entry
        ) {

            result =
                "LOSS";

        }

    } else {

        if (
            exit <
            order.entry
        ) {

            result =
                "WIN";

            pnl =
                order.amount *
                0.8;

        } else if (
            exit >
            order.entry
        ) {

            result =
                "LOSS";

        }

    }


    if (
        result ===
        "WIN"
    ) {

        balance +=
            order.amount +
            pnl;

    }


    if (
        result ===
        "DRAW"
    ) {

        balance +=
            order.amount;

    }


    saveBalance();


    let history =
        [];


    try {

        history =
            JSON.parse(
                localStorage.getItem(
                    "demoHistory"
                ) ||
                "[]"
            );

    } catch (error) {}


    if (
        !Array.isArray(
            history
        )
    ) {

        history =
            [];

    }


    history.unshift(
        {
            time:
                Date.now(),

            symbol,

            side:
                order.side,

            amount:
                order.amount,

            entry:
                order.entry,

            exit,

            result,

            pnl:
                result ===
                "WIN"
                    ? pnl
                    : result ===
                        "LOSS"
                        ? -order.amount
                        : 0
        }
    );


    history =
        history.slice(
            0,
            100
        );


    localStorage.setItem(
        "demoHistory",
        JSON.stringify(
            history
        )
    );


    const resultPnl =
        result ===
        "DRAW"
            ? 0
            : result ===
                "WIN"
                ? pnl
                : -order.amount;


    document.getElementById(
        "orderStatus"
    ).textContent =
        result +
        " | Exit " +
        fmtPrice(
            exit
        ) +
        " | P/L " +
        (
            resultPnl >
            0
                ? "+"
                : ""
        ) +
        resultPnl.toFixed(
            2
        ) +
        " USDT";


    activeOrder =
        null;


    renderHistory();

}


function renderHistory() {

    let history =
        [];


    try {

        history =
            JSON.parse(
                localStorage.getItem(
                    "demoHistory"
                ) ||
                "[]"
            );

    } catch (error) {}


    if (
        !Array.isArray(
            history
        ) ||
        !history.length
    ) {

        document.getElementById(
            "historyList"
        ).innerHTML =
            '<div style="color:#718095;font-size:12px">No demo trades yet.</div>';

        return;

    }


    document.getElementById(
        "historyList"
    ).innerHTML =
        history
            .slice(
                0,
                20
            )
            .map(
                function (item) {

                    return (
                        '<div class="history-row">' +

                        "<span>" +
                        item.symbol +
                        " " +
                        item.side +
                        "</span>" +

                        "<span>" +
                        Number(
                            item.amount
                        ).toFixed(
                            2
                        ) +
                        "</span>" +

                        "<span>" +
                        item.result +
                        "</span>" +

                        '<span class="' +
                        (
                            item.result ===
                            "WIN"
                                ? "win"
                                : item.result ===
                                    "LOSS"
                                    ? "loss"
                                    : "draw"
                        ) +
                        '">' +

                        (
                            item.pnl >
                            0
                                ? "+"
                                : ""
                        ) +

                        Number(
                            item.pnl
                        ).toFixed(
                            2
                        ) +

                        "</span>" +

                        "</div>"
                    );

                }
            )
            .join(
                ""
            );

}


renderHistory();


(
    async function init() {

        try {

            createChart();


            resizeCanvas();


            chart
                .timeScale()
                .subscribeVisibleLogicalRangeChange(
                    redraw
                );


            window.addEventListener(
                "resize",
                resizeCanvas
            );


            document
                .querySelectorAll(
                    "[data-interval]"
                )
                .forEach(
                    function (button) {

                        button.classList.toggle(
                            "active",
                            button.dataset.interval ===
                            currentInterval
                        );

                    }
                );


            connect24();


            connectPrice();


            restPriceFallback();


            await loadKlines();


            connectKline();

        } catch (error) {

            console.error(
                error
            );


            document.getElementById(
                "chartLoading"
            ).textContent =
                "K-line initialization error";


            document.getElementById(
                "connectionDot"
            ).className =
                "status-dot error";


            document.getElementById(
                "connectionText"
            ).textContent =
                "Fallback mode";


            restPriceFallback();

        }

    }
)();

</script>
