<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Trading Demo</title>
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#080d13;
  color:#eef3f8;
  font-family:Arial,Helvetica,sans-serif;
  padding-bottom:74px
}
.header{
  background:#0d141d;
  padding:16px 18px 18px;
  border-bottom:1px solid #202b38
}
.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center
}
.pair-area{
  display:flex;
  align-items:center;
  gap:8px
}
.pair-name{
  font-size:22px;
  font-weight:700
}
.demo-tag{
  padding:4px 7px;
  border-radius:5px;
  background:#243348;
  color:#8fb9ff;
  font-size:10px
}
.favorite-btn{
  width:42px;
  height:42px;
  border:1px solid #2b3948;
  border-radius:8px;
  background:#111923;
  color:#9ba8ba;
  font-size:24px;
  cursor:pointer
}
.favorite-btn.active{color:#ffd43b}

.market-overview{
  margin-top:18px;
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:28px;
  align-items:center
}
.latest-label,.mark-row,.feed-status,.market-stat-label{
  color:#758398;
  font-size:12px
}
.price-row{
  display:flex;
  align-items:baseline;
  gap:10px;
  flex-wrap:wrap
}
.price{
  font-size:46px;
  line-height:1;
  font-weight:700;
  color:#24d79a
}
.price.red,.change24.red{color:#f25b68}
.change24{
  font-size:20px;
  color:#24d79a
}
.mark-row{margin-top:9px}
.mark-row span{color:#a7b1bf}
.feed-status{
  margin-top:7px;
  font-size:10px
}
.status-dot{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#f2b742;
  margin-right:5px
}
.status-dot.online{background:#24d79a}
.status-dot.error{background:#f25b68}

.market-stats{display:grid;gap:10px}
.market-stat{
  display:grid;
  grid-template-columns:1fr auto;
  gap:18px
}
.market-stat-value{
  font-size:16px;
  text-align:right
}

.box{
  margin:13px;
  border:1px solid #202b37;
  border-radius:8px;
  background:#0e161f
}
.balance-box{padding:14px}
.balance-label{
  font-size:11px;
  color:#718095
}
.balance{
  margin-top:5px;
  font-size:23px;
  font-weight:700
}

.chart-box{
  position:relative;
  height:440px;
  overflow:hidden;
  background:#0c1219
}
.kline-timeframes{
  height:44px;
  display:flex;
  align-items:center;
  gap:6px;
  padding:6px 8px;
  overflow-x:auto;
  border-bottom:1px solid #202b37;
  background:#0d141d
}
.kline-timeframes button{
  flex:0 0 auto;
  min-width:43px;
  height:30px;
  padding:0 9px;
  border:1px solid transparent;
  border-radius:6px;
  background:transparent;
  color:#8290a3;
  cursor:pointer
}
.kline-timeframes button.active{
  color:#57a8ff;
  background:#14243a;
  border-color:#294a6e
}
.indicator-btn{
  min-width:78px!important;
  border-color:#2b3d52!important;
  background:#111b27!important
}
.indicator-btn.active{
  color:#57a8ff!important;
  border-color:#315c8d!important;
  background:#13243a!important
}

#klineChart{
  width:100%;
  height:calc(100% - 44px)
}
#chartLoading{
  position:absolute;
  inset:44px 0 0 0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#7890ad;
  font-size:12px;
  pointer-events:none
}

.chart-tools{
  position:absolute;
  left:7px;
  top:54px;
  z-index:12;
  display:flex;
  flex-direction:column;
  gap:4px;
  padding:5px;
  border:1px solid #263240;
  border-radius:8px;
  background:rgba(13,20,29,.95)
}
.chart-tool{
  width:30px;
  height:30px;
  border:1px solid transparent;
  border-radius:6px;
  background:transparent;
  color:#a3afbe;
  cursor:pointer
}
.chart-tool.active,.chart-tool:hover{
  background:#182332;
  border-color:#33465d;
  color:#fff
}

#drawingCanvas{
  position:absolute;
  left:0;
  top:44px;
  width:100%;
  height:calc(100% - 44px);
  z-index:9;
  pointer-events:none;
  touch-action:none
}
.drawing-hint{
  position:absolute;
  left:50px;
  top:53px;
  z-index:11;
  display:none;
  padding:5px 8px;
  border-radius:5px;
  background:rgba(12,18,25,.9);
  font-size:10px;
  color:#aab7c7
}

.trade-box{padding:14px}
.section-title{
  font-size:16px;
  font-weight:700;
  margin-bottom:14px
}
.field{margin-bottom:12px}
.field label{
  display:block;
  font-size:11px;
  color:#718095;
  margin-bottom:6px
}
.input,.select{
  width:100%;
  height:44px;
  border:1px solid #2b3948;
  border-radius:7px;
  background:#101923;
  color:#fff;
  padding:0 12px;
  outline:none
}
.quick-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-bottom:14px
}
.quick-row button{
  height:36px;
  border:1px solid #2b3948;
  border-radius:6px;
  background:#101923;
  color:#9ed1ff;
  cursor:pointer
}

.trade-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}
.trade-actions button{
  height:48px;
  border:0;
  border-radius:8px;
  color:#fff;
  font-weight:700;
  cursor:pointer
}
.up-btn{background:#169b70}
.down-btn{background:#d84f5c}

.order-status{
  margin-top:12px;
  padding:10px;
  border-radius:7px;
  background:#0b1219;
  color:#aab7c7;
  font-size:12px;
  display:none
}

.active-order-panel{
  margin:13px;
  padding:14px;
  border:1px solid #202b37;
  border-radius:8px;
  background:#0e161f;
  display:none
}
.active-order-title{
  font-size:12px;
  color:#718095;
  margin-bottom:8px
}
.active-order-main{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px
}
.active-order-side{
  font-size:15px;
  font-weight:700;
  color:#eef3f8
}
.active-order-countdown{
  font-size:30px;
  line-height:1;
  font-weight:800;
  color:#24d79a;
  letter-spacing:.5px
}
.active-order-sub{
  margin-top:8px;
  color:#8f9daf;
  font-size:11px;
  line-height:1.55
}

.history{padding:14px}
.history-head,.history-row{
  display:grid;
  grid-template-columns:1.2fr .8fr .8fr .8fr;
  gap:8px;
  align-items:center
}
.history-head{
  padding:0 0 8px;
  color:#718095;
  font-size:10px;
  border-bottom:1px solid #1c2733
}
.history-row{
  padding:10px 0;
  border-bottom:1px solid #1c2733;
  font-size:12px
}
.history-empty{
  color:#718095;
  font-size:12px;
  padding:10px 0
}
.win{color:#24d79a}
.loss{color:#f25b68}
.draw{color:#d3a94a}

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:64px;
  background:#0d141d;
  border-top:1px solid #202b38;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  z-index:50
}
.bottom-nav a{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#8290a3;
  text-decoration:none;
  font-size:12px
}
.bottom-nav a.active{color:#409cff}

.chart-touch-lock{
  position:absolute;
  left:0;
  right:0;
  top:44px;
  bottom:0;
  z-index:8;
  background:transparent;
  touch-action:pan-y
}
.chart-touch-lock span{
  position:absolute;
  right:10px;
  top:10px;
  padding:5px 8px;
  border-radius:5px;
  background:rgba(12,18,25,.78);
  color:#8290a3;
  font-size:10px;
  opacity:.85;
  pointer-events:none
}
.chart-box.chart-active .chart-touch-lock{display:none}

@media(max-width:650px){
  .market-overview{
    grid-template-columns:1fr 1fr;
    gap:12px
  }
  .price{font-size:34px}
  .change24{font-size:15px}
  .market-stat-value{font-size:13px}
  .chart-box{height:390px}

  .chart-tools{
    left:4px;
    top:50px;
    gap:2px;
    padding:3px;
    border-radius:6px
  }
  .chart-tool{
    width:23px;
    height:23px;
    min-width:23px;
    padding:0;
    font-size:10px;
    line-height:21px;
    border-radius:4px
  }

  #klineChart{touch-action:pan-y}
  .chart-box.chart-active #klineChart{touch-action:none}
  .quick-row{grid-template-columns:repeat(2,1fr)}

  .active-order-panel{
    margin:10px 13px 13px
  }
  .active-order-countdown{font-size:28px}

  .history{overflow:hidden}
  .history-head,.history-row{
    grid-template-columns:1.35fr .85fr .7fr .8fr;
    gap:5px;
    font-size:11px
  }
  .history-head{font-size:9px}
  .history-row span{
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap
  }
}
</style>
</head>

<body>

    <div class="pair-area">

      <span class="demo-tag">DEMO</span>
    </div>
    <button id="favoriteBtn" class="favorite-btn" onclick="toggleFavorite()">☆</button>
  </div>

  <div class="market-overview">
    <div>
      <div class="latest-label">最新成交价</div>

      <div class="price-row">
        <div id="price" class="price">Loading...</div>

      </div>

      <div class="market-stat">

  <div class="kline-timeframes">

    <button data-interval="1h">1h</button>

    Demo History

<script>
const COINS={
BTC:'bitcoin',
ETH:'ethereum',
BNB:'binancecoin',
SOL:'solana',
XRP:'ripple',
DOGE:'dogecoin',
ADA:'cardano',
TRX:'tron',
AVAX:'avalanche-2',
LINK:'chainlink',
DOT:'polkadot',
BCH:'bitcoin-cash',
LTC:'litecoin',
UNI:'uniswap',
XLM:'stellar',
TON:'the-open-network',
SHIB:'shiba-inu',
HBAR:'hedera-hashgraph',
SUI:'sui',
APT:'aptos',
NEAR:'near',
ICP:'internet-computer',
ETC:'ethereum-classic',
FIL:'filecoin',
ATOM:'cosmos',
ARB:'arbitrum',
OP:'optimism',
AAVE:'aave',
PEPE:'pepe',
POL:'matic-network'
};

const params=new URLSearchParams(location.search);

let symbol=(params.get('symbol')||'BTC').toUpperCase();

if(!COINS[symbol]) symbol='BTC';

const binanceSymbol=symbol+'USDT';

document.getElementById('pairName').textContent=symbol+' / USDT';

let balance=Number(localStorage.getItem('demoBalance'));

if(!Number.isFinite(balance)){
  balance=10000;
  localStorage.setItem('demoBalance',balance);
}

let currentPrice=0;
let previousPrice=0;

let chart=null;
let candleSeries=null;
let candleData=[];

let currentInterval=localStorage.getItem('klineInterval')||'15m';

let priceSocket=null;
let ticker24Socket=null;
let klineSocket=null;

const chartBox=document.getElementById('chartBox');
const chartTouchLock=document.getElementById('chartTouchLock');

function fmtPrice(n){
  n=Number(n);

  if(!Number.isFinite(n)) return '--';

  if(n>=1000) return n.toLocaleString(undefined,{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });

  if(n>=1) return n.toFixed(4);

  return n.toPrecision(6);
}

function fmtVolume(n){
  n=Number(n);

  if(!Number.isFinite(n)) return '--';

  if(n>=1e9) return (n/1e9).toFixed(2)+'B';
  if(n>=1e6) return (n/1e6).toFixed(2)+'M';
  if(n>=1e3) return (n/1e3).toFixed(2)+'K';

  return n.toFixed(2);
}

function updateBalance(){
  document.getElementById('balance').textContent=
    balance.toFixed(2)+' USDT';
}

function saveBalance(){
  localStorage.setItem('demoBalance',balance);
  updateBalance();
}

updateBalance();

function updatePriceUI(price){

  price=Number(price);

  if(!Number.isFinite(price)||price<=0) return;

  previousPrice=currentPrice||price;
  currentPrice=price;

  const el=document.getElementById('price');

  el.textContent=fmtPrice(price);

  el.classList.toggle('red',price<previousPrice);

  document.getElementById('markPrice').textContent=fmtPrice(price);

  document.getElementById('connectionDot').className=
    'status-dot online';

  document.getElementById('connectionText').textContent='Live';
}

function update24h(data){

  const change=Number(data.P);
  const high=Number(data.h);
  const low=Number(data.l);
  const quote=Number(data.q);

  const changeEl=document.getElementById('change24h');

  if(Number.isFinite(change)){
    changeEl.textContent=
      (change>=0?'+':'')+
      change.toFixed(2)+'%';

    changeEl.classList.toggle('red',change<0);
  }

  if(Number.isFinite(high)){
    document.getElementById('high24h').textContent=fmtPrice(high);
  }

  if(Number.isFinite(low)){
    document.getElementById('low24h').textContent=fmtPrice(low);
  }

  if(Number.isFinite(quote)){
    document.getElementById('volume24h').textContent=
      fmtVolume(quote)+' USDT';
  }
}

function connectPrice(){

  try{
    if(priceSocket) priceSocket.close();
  }catch(e){}

  priceSocket=new WebSocket(
    'wss://stream.binance.com:9443/ws/'+
    binanceSymbol.toLowerCase()+
    '@trade'
  );

  priceSocket.onmessage=e=>{
    try{
      const d=JSON.parse(e.data);
      updatePriceUI(d.p);
    }catch(err){}
  };

  priceSocket.onerror=()=>{
    document.getElementById('connectionDot').className=
      'status-dot error';

    document.getElementById('connectionText').textContent=
      'REST fallback';
  };
}

function connect24(){

  try{
    if(ticker24Socket) ticker24Socket.close();
  }catch(e){}

  ticker24Socket=new WebSocket(
    'wss://stream.binance.com:9443/ws/'+
    binanceSymbol.toLowerCase()+
    '@ticker'
  );

  ticker24Socket.onmessage=e=>{
    try{
      update24h(JSON.parse(e.data));
    }catch(err){}
  };
}

async function restPriceFallback(){

  const urls=[
    'https://data-api.binance.vision/api/v3/ticker/price?symbol='+binanceSymbol,
    'https://api.binance.com/api/v3/ticker/price?symbol='+binanceSymbol,
    'https://api1.binance.com/api/v3/ticker/price?symbol='+binanceSymbol
  ];

  for(const url of urls){

    try{
      const controller=new AbortController();

      const timeout=setTimeout(()=>{
        controller.abort();
      },4000);

      const res=await fetch(url,{
        signal:controller.signal
      });

      clearTimeout(timeout);

      if(!res.ok) continue;

      const d=await res.json();

      if(d&&d.price){
        updatePriceUI(d.price);
        return;
      }

    }catch(e){}
  }
}

function setChartInteraction(active){

  if(!chart) return;

  chartBox.classList.toggle('chart-active',active);

  chart.applyOptions({

    handleScroll:{
      mouseWheel:active,
      pressedMouseMove:active,
      horzTouchDrag:active,
      vertTouchDrag:active
    },

    handleScale:{
      axisPressedMouseMove:active,
      mouseWheel:active,
      pinch:active
    }

  });
}

chartTouchLock.addEventListener('click',()=>{
  setChartInteraction(true);
});

document.addEventListener('pointerdown',e=>{

  if(window.innerWidth>650) return;

  if(!chartBox.contains(e.target)){
    setChartInteraction(false);
  }

});

function createChart(){

  chart=LightweightCharts.createChart(
    document.getElementById('klineChart'),
    {
      layout:{
        background:{
          type:'solid',
          color:'#0c1219'
        },
        textColor:'#7f8ea3'
      },

      grid:{
        vertLines:{color:'#17202a'},
        horzLines:{color:'#17202a'}
      },

      rightPriceScale:{
        borderColor:'#283544'
      },

      timeScale:{
        borderColor:'#283544',
        timeVisible:true,
        secondsVisible:false,
        barSpacing:8,
        minBarSpacing:5,
        rightOffset:4
      },

      crosshair:{
        mode:LightweightCharts.CrosshairMode.Normal
      }
    }
  );

  candleSeries=chart.addCandlestickSeries({

    upColor:'#24d79a',
    downColor:'#f25b68',

    borderUpColor:'#24d79a',
    borderDownColor:'#f25b68',

    wickUpColor:'#24d79a',
    wickDownColor:'#f25b68',

    priceFormat:{
      type:'price',
      precision:8,
      minMove:0.00000001
    }
  });

  new ResizeObserver(entries=>{

    for(const entry of entries){

      chart.applyOptions({
        width:entry.contentRect.width,
        height:entry.contentRect.height
      });

      resizeCanvas();
    }

  }).observe(document.getElementById('klineChart'));
}

const binanceHosts=[
  'https://data-api.binance.vision',
  'https://api.binance.com',
  'https://api1.binance.com',
  'https://api2.binance.com',
  'https://api3.binance.com'
];

async function fetchJSON(url,timeout=4500){

  const controller=new AbortController();

  const timer=setTimeout(()=>{
    controller.abort();
  },timeout);

  try{
    const res=await fetch(url,{
      signal:controller.signal
    });

    if(!res.ok){
      throw new Error('HTTP '+res.status);
    }

    return await res.json();

  }finally{
    clearTimeout(timer);
  }
}

function parseKlines(rows){

  return rows.map(k=>({

    time:Math.floor(Number(k[0])/1000),

    open:Number(k[1]),
    high:Number(k[2]),
    low:Number(k[3]),
    close:Number(k[4])

  })).filter(x=>
    Number.isFinite(x.time)&&
    Number.isFinite(x.open)&&
    Number.isFinite(x.high)&&
    Number.isFinite(x.low)&&
    Number.isFinite(x.close)
  );
}

async function loadKlines(){

  document.getElementById('chartLoading').style.display='flex';

  document.getElementById('chartLoading').textContent=
    'Loading K-line...';

  let rows=null;

  for(const host of binanceHosts){

    try{

      const url=
        host+
        '/api/v3/klines?symbol='+
        binanceSymbol+
        '&interval='+
        currentInterval+
        '&limit=300';

      const d=await fetchJSON(url);

      if(Array.isArray(d)&&d.length){

        rows=d;
        break;
      }

    }catch(e){}
  }

  const cacheKey=
    'klineCache_'+
    binanceSymbol+
    '_'+
    currentInterval;

  if(rows){

    candleData=parseKlines(rows);

    try{
      localStorage.setItem(
        cacheKey,
        JSON.stringify(candleData)
      );
    }catch(e){}

  }else{

    try{
      candleData=
        JSON.parse(
          localStorage.getItem(cacheKey)||'[]'
        );
    }catch(e){
      candleData=[];
    }
  }

  if(candleData.length){

    candleSeries.setData(candleData);

    const total=candleData.length;

    chart.timeScale().setVisibleLogicalRange({
      from:Math.max(0,total-72),
      to:total+3
    });

    document.getElementById('chartLoading').style.display='none';

  }else{

    document.getElementById('chartLoading').textContent=
      'Historical K-line unavailable';
  }

  refreshIndicators();
  redraw();
}

function connectKline(){

  try{
    if(klineSocket) klineSocket.close();
  }catch(e){}

  klineSocket=new WebSocket(
    'wss://stream.binance.com:9443/ws/'+
    binanceSymbol.toLowerCase()+
    '@kline_'+
    currentInterval
  );

  klineSocket.onmessage=e=>{

    try{

      const d=JSON.parse(e.data);

      const k=d.k;

      if(!k) return;

      const candle={
        time:Math.floor(Number(k.t)/1000),
        open:Number(k.o),
        high:Number(k.h),
        low:Number(k.l),
        close:Number(k.c)
      };

      candleSeries.update(candle);

      const last=candleData[candleData.length-1];

      if(last&&last.time===candle.time){
        candleData[candleData.length-1]=candle;
      }else{
        candleData.push(candle);

        if(candleData.length>300){
          candleData.shift();
        }
      }

      if(indicatorsEnabled){
        refreshIndicators();
      }

    }catch(err){}
  };
}

async function setIntervalKline(v){

  currentInterval=v;

  localStorage.setItem('klineInterval',v);

  document.querySelectorAll('[data-interval]').forEach(b=>{
    b.classList.toggle(
      'active',
      b.dataset.interval===v
    );
  });

  await loadKlines();

  connectKline();

  redraw();
}

document.querySelectorAll('[data-interval]').forEach(b=>{

  b.onclick=()=>{
    setIntervalKline(b.dataset.interval);
  };

});

let sma5=null;
let sma20=null;
let indicatorsEnabled=false;

function sma(period){

  const out=[];
  let sum=0;

  for(let i=0;i<candleData.length;i++){

    sum+=candleData[i].close;

    if(i>=period){
      sum-=candleData[i-period].close;
    }

    if(i>=period-1){

      out.push({
        time:candleData[i].time,
        value:sum/period
      });

    }
  }

  return out;
}

function refreshIndicators(){

  if(!chart) return;

  if(!sma5){

    sma5=chart.addLineSeries({
      color:'#f1c75b',
      lineWidth:1,
      priceLineVisible:false,
      lastValueVisible:false
    });
  }

  if(!sma20){

    sma20=chart.addLineSeries({
      color:'#8c7cff',
      lineWidth:1,
      priceLineVisible:false,
      lastValueVisible:false
    });
  }

  sma5.setData(
    indicatorsEnabled?sma(5):[]
  );

  sma20.setData(
    indicatorsEnabled?sma(20):[]
  );
}

document.getElementById('indicatorBtn').onclick=()=>{

  indicatorsEnabled=!indicatorsEnabled;

  document
    .getElementById('indicatorBtn')
    .classList.toggle(
      'active',
      indicatorsEnabled
    );

  document.getElementById('indicatorBtn').textContent=
    indicatorsEnabled
      ?'MA 5 / 20'
      :'Indicators';

  refreshIndicators();
};

const canvas=document.getElementById('drawingCanvas');

const ctx=canvas.getContext('2d');

const hint=document.getElementById('drawingHint');

let tool='cursor';
let startPoint=null;
let preview=null;
let drawings=[];

function resizeCanvas(){

  const r=
    document
      .getElementById('klineChart')
      .getBoundingClientRect();

  const d=devicePixelRatio||1;

  canvas.width=
    Math.max(
      1,
      Math.round(r.width*d)
    );

  canvas.height=
    Math.max(
      1,
      Math.round(r.height*d)
    );

  ctx.setTransform(
    d,0,0,d,0,0
  );

  redraw();
}

function eventPoint(e){

  const r=canvas.getBoundingClientRect();

  const x=e.clientX-r.left;
  const y=e.clientY-r.top;

  const t=
    chart
      .timeScale()
      .coordinateToTime(x);

  const p=
    candleSeries
      .coordinateToPrice(y);

  if(
    t==null||
    !Number.isFinite(+p)
  ){
    return null;
  }

  return{
    time:
      typeof t==='number'
        ?t
        :null,

    price:+p
  };
}

function coord(p){

  if(!p||p.time==null){
    return null;
  }

  const x=
    chart
      .timeScale()
      .timeToCoordinate(p.time);

  const y=
    candleSeries
      .priceToCoordinate(p.price);

  if(x==null||y==null){
    return null;
  }

  return{x,y};
}

function drawOne(d,ghost=false){

  ctx.save();

  ctx.strokeStyle=
    ghost
      ?'rgba(113,179,255,.7)'
      :'#5baeff';

  ctx.fillStyle=
    'rgba(91,174,255,.12)';

  ctx.lineWidth=
    ghost?1:1.4;

  ctx.font='12px Arial';

  if(d.type==='horizontal'){

    const y=
      candleSeries
        .priceToCoordinate(d.price);

    if(y!=null){

      ctx.setLineDash([5,4]);

      ctx.beginPath();

      ctx.moveTo(0,y);

      ctx.lineTo(
        canvas.clientWidth,
        y
      );

      ctx.stroke();
    }

    ctx.restore();
    return;
  }

  if(d.type==='vertical'){

    const x=
      chart
        .timeScale()
        .timeToCoordinate(d.time);

    if(x!=null){

      ctx.setLineDash([5,4]);

      ctx.beginPath();

      ctx.moveTo(x,0);

      ctx.lineTo(
        x,
        canvas.clientHeight
      );

      ctx.stroke();
    }

    ctx.restore();
    return;
  }

  const a=coord(d.a);
  const b=coord(d.b);

  if(d.type==='text'){

    if(a){

      ctx.fillStyle='#dce6f3';

      ctx.fillText(
        d.text,
        a.x+4,
        a.y-6
      );
    }

    ctx.restore();
    return;
  }

  if(!a||!b){

    ctx.restore();
    return;
  }

  if(d.type==='trend'){

    ctx.beginPath();

    ctx.moveTo(a.x,a.y);

    ctx.lineTo(b.x,b.y);

    ctx.stroke();
  }

  if(d.type==='rectangle'){

    const x=Math.min(a.x,b.x);
    const y=Math.min(a.y,b.y);

    const w=Math.abs(b.x-a.x);
    const h=Math.abs(b.y-a.y);

    ctx.fillRect(x,y,w,h);
    ctx.strokeRect(x,y,w,h);
  }

  if(d.type==='ruler'){

    ctx.setLineDash([4,3]);

    ctx.beginPath();

    ctx.moveTo(a.x,a.y);

    ctx.lineTo(b.x,b.y);

    ctx.stroke();

    const ch=
      d.b.price-
      d.a.price;

    const p=
      d.a.price
        ?ch/d.a.price*100
        :0;

    const label=
      (ch>=0?'+':'')+
      ch.toFixed(2)+
      ' ('+
      (p>=0?'+':'')+
      p.toFixed(2)+
      '%)';

    ctx.setLineDash([]);

    ctx.fillStyle=
      'rgba(12,18,25,.9)';

    ctx.fillRect(
      (a.x+b.x)/2-55,
      (a.y+b.y)/2-20,
      110,
      18
    );

    ctx.fillStyle='#fff';

    ctx.textAlign='center';

    ctx.fillText(
      label,
      (a.x+b.x)/2,
      (a.y+b.y)/2-7
    );
  }

  ctx.restore();
}

function redraw(){

  ctx.clearRect(
    0,
    0,
    canvas.clientWidth,
    canvas.clientHeight
  );

  drawings.forEach(d=>{
    drawOne(d);
  });

  if(preview){
    drawOne(preview,true);
  }
}

function setTool(t){

  if(t==='clear'){

    drawings=[];
    preview=null;
    startPoint=null;

    setTool('cursor');

    redraw();

    return;
  }

  tool=t;

  startPoint=null;
  preview=null;

  document
    .querySelectorAll('.chart-tool')
    .forEach(b=>{

      b.classList.toggle(
        'active',
        b.dataset.tool===t
      );

    });

  canvas.style.pointerEvents=
    t==='cursor'
      ?'none'
      :'auto';

  canvas.style.cursor=
    t==='cursor'
      ?'default'
      :'crosshair';

  hint.style.display=
    t==='cursor'
      ?'none'
      :'block';

  hint.textContent=
    ['trend','rectangle','ruler'].includes(t)
      ?'Select two points'
      :t==='text'
        ?'Tap chart to add text'
        :'Tap chart to place';

  redraw();
}

document
  .querySelectorAll('.chart-tool')
  .forEach(b=>{

    b.onclick=()=>{
      setTool(b.dataset.tool);
    };

  });

canvas.addEventListener(
  'pointerdown',
  e=>{

    if(tool==='cursor'){
      return;
    }

    const p=eventPoint(e);

    if(!p||p.time==null){
      return;
    }

    if(tool==='horizontal'){

      drawings.push({
        type:'horizontal',
        price:p.price
      });

      redraw();
      return;
    }

    if(tool==='vertical'){

      drawings.push({
        type:'vertical',
        time:p.time
      });

      redraw();
      return;
    }

    if(tool==='text'){

      const s=prompt('Text:','');

      if(s&&s.trim()){

        drawings.push({
          type:'text',
          a:p,
          b:p,
          text:s.trim()
        });

        redraw();
      }

      return;
    }

    if(!startPoint){

      startPoint=p;

      preview={
        type:tool,
        a:p,
        b:p
      };

      redraw();

      return;
    }

    drawings.push({
      type:tool,
      a:startPoint,
      b:p
    });

    startPoint=null;
    preview=null;

    redraw();
  }
);

canvas.addEventListener(
  'pointermove',
  e=>{

    if(
      !startPoint||
      !['trend','rectangle','ruler'].includes(tool)
    ){
      return;
    }

    const p=eventPoint(e);

    if(p){

      preview={
        type:tool,
        a:startPoint,
        b:p
      };

      redraw();
    }
  }
);

function toggleFavorite(){

  let arr=[];

  try{
    arr=JSON.parse(
      localStorage.getItem('marketFavorites')||'[]'
    );
  }catch(e){}

  arr=Array.isArray(arr)?arr:[];

  if(arr.includes(symbol)){

    arr=arr.filter(x=>x!==symbol);

  }else{

    arr.push(symbol);
  }

  localStorage.setItem(
    'marketFavorites',
    JSON.stringify(arr)
  );

  updateFavorite();
}

function updateFavorite(){

  let arr=[];

  try{
    arr=JSON.parse(
      localStorage.getItem('marketFavorites')||'[]'
    );
  }catch(e){}

  const on=
    Array.isArray(arr)&&
    arr.includes(symbol);

  const b=
    document.getElementById('favoriteBtn');

  b.textContent=
    on?'★':'☆';

  b.classList.toggle(
    'active',
    on
  );
}

updateFavorite();

function setAmount(v){

  document.getElementById('amount').value=v;
}

let activeOrder=null;

function showActiveOrderPanel(order,left){

  const panel=
    document.getElementById('activeOrderPanel');

  const sideEl=
    document.getElementById('activeOrderSide');

  const countEl=
    document.getElementById('activeOrderCountdown');

  const subEl=
    document.getElementById('activeOrderSub');

  if(!panel||!order){
    return;
  }

  panel.style.display='block';

  sideEl.textContent=
    order.side+
    ' '+
    order.symbol;

  countEl.textContent=
    Math.max(0,left)+
    's';

  subEl.textContent=
    'Entry '+
    fmtPrice(order.entry)+
    ' · Amount '+
    Number(order.amount).toFixed(2)+
    ' USDT · Duration '+
    order.duration+
    's';
}

function hideActiveOrderPanel(){

  const panel=
    document.getElementById('activeOrderPanel');

  if(panel){
    panel.style.display='none';
  }
}

function placeOrder(side){

  if(activeOrder){
    return alert('已有订单进行中');
  }

  const amount=
    Number(
      document.getElementById('amount').value
    );

  const duration=
    Number(
      document.getElementById('duration').value
    );

  if(!currentPrice){
    return alert('价格还没加载');
  }

  if(
    !Number.isFinite(amount)||
    amount<=0
  ){
    return alert('请输入正确金额');
  }

  if(amount>balance){
    return alert('Demo Balance 不足');
  }

  balance-=amount;

  saveBalance();

  const entry=currentPrice;

  const end=
    Date.now()+
    duration*1000;

  activeOrder={
    side,
    symbol,
    amount,
    duration,
    entry,
    end
  };

  const box=
    document.getElementById('orderStatus');

  box.style.display='block';

  showActiveOrderPanel(
    activeOrder,
    duration
  );

  const timer=setInterval(()=>{

    const left=
      Math.max(
        0,
        Math.ceil(
          (end-Date.now())/1000
        )
      );

    showActiveOrderPanel(
      activeOrder,
      left
    );

    box.textContent=
      side+
      ' | Entry '+
      fmtPrice(entry)+
      ' | '+
      left+
      's';

    if(left<=0){

      clearInterval(timer);

      finishOrder();
    }

  },250);
}

function finishOrder(){

  if(!activeOrder){
    return;
  }

  const o=activeOrder;

  const exit=
    currentPrice||
    o.entry;

  let result='DRAW';

  let pnl=0;

  if(o.side==='BUY'){

    if(exit>o.entry){

      result='WIN';

      pnl=o.amount*.8;

    }else if(exit<o.entry){

      result='LOSS';
    }

  }else{

    if(exit<o.entry){

      result='WIN';

      pnl=o.amount*.8;

    }else if(exit>o.entry){

      result='LOSS';
    }
  }

  if(result==='WIN'){

    balance+=
      o.amount+
      pnl;
  }

  if(result==='DRAW'){

    balance+=o.amount;
  }

  saveBalance();

  let h=[];

  try{

    h=JSON.parse(
      localStorage.getItem('demoHistory')||'[]'
    );

  }catch(e){}

  if(!Array.isArray(h)){
    h=[];
  }

  h.unshift({

    time:Date.now(),

    symbol:o.symbol,

    side:o.side,

    amount:o.amount,

    entry:o.entry,

    exit:exit,

    result:result,

    pnl:
      result==='WIN'
        ?pnl
        :result==='LOSS'
          ?-o.amount
          :0

  });

  h=h.slice(0,100);

  localStorage.setItem(
    'demoHistory',
    JSON.stringify(h)
  );

  document.getElementById('orderStatus').textContent=
    result+
    ' | Exit '+
    fmtPrice(exit)+
    ' | P/L '+
    (
      result==='WIN'
        ?'+'
        :''
    )+
    (
      result==='DRAW'
        ?0
        :result==='WIN'
          ?pnl
          :-o.amount
    ).toFixed(2)+
    ' USDT';

  activeOrder=null;

  hideActiveOrderPanel();

  renderHistory();
}

function displaySide(side){

  if(side==='UP'){
    return 'BUY';
  }

  if(side==='DOWN'){
    return 'SELL';
  }

  return side||'--';
}

function renderHistory(){

  let h=[];

  try{

    h=JSON.parse(
      localStorage.getItem('demoHistory')||'[]'
    );

  }catch(e){}

  if(
    !Array.isArray(h)||
    !h.length
  ){

    document.getElementById('historyList').innerHTML=
      '<div class="history-empty">No demo trades yet.</div>';

    return;
  }

  document.getElementById('historyList').innerHTML=
    h.slice(0,20).map(x=>{

      const amount=
        Number(x.amount)||0;

      const pnl=
        Number(x.pnl)||0;

      const result=
        x.result||'--';

      const css=
        result==='WIN'
          ?'win'
          :result==='LOSS'
            ?'loss'
            :'draw';

      return(
        '<div class="history-row">'+
          '<span>'+
            (x.symbol||symbol)+
            ' '+
            displaySide(x.side)+
          '</span>'+
          '<span>'+
            amount.toFixed(2)+
          '</span>'+
          '<span class="'+css+'">'+
            result+
          '</span>'+
          '<span class="'+css+'">'+
            (pnl>0?'+':'')+
            pnl.toFixed(2)+
          '</span>'+
        '</div>'
      );

    }).join('');
}

renderHistory();

(async function init(){

  try{

    createChart();

    if(window.innerWidth<=650){

      setChartInteraction(false);

    }else{

      setChartInteraction(true);
    }

    resizeCanvas();

    chart
      .timeScale()
      .subscribeVisibleLogicalRangeChange(
        redraw
      );

    window.addEventListener(
      'resize',
      ()=>{

        resizeCanvas();

        if(window.innerWidth<=650){

          setChartInteraction(false);

        }else{

          setChartInteraction(true);
        }
      }
    );

    document
      .querySelectorAll('[data-interval]')
      .forEach(b=>{

        b.classList.toggle(
          'active',
          b.dataset.interval===currentInterval
        );

      });

    connect24();

    connectPrice();

    restPriceFallback();

    await loadKlines();

    connectKline();

  }catch(e){

    console.error(e);

    document.getElementById('chartLoading').textContent=
      'K-line initialization error';

    document.getElementById('connectionDot').className=
      'status-dot error';

    document.getElementById('connectionText').textContent=
      'Fallback mode';

    restPriceFallback();
  }

})();
</script>
