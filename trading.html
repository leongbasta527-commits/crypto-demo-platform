<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Trading Demo</title>
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d13;color:#eef3f8;font-family:Arial,Helvetica,sans-serif;padding-bottom:74px}.header{background:#0d141d;padding:16px 18px 18px;border-bottom:1px solid #202b38}.header-top{display:flex;justify-content:space-between;align-items:center}.pair-area{display:flex;align-items:center;gap:8px}.pair-name{font-size:22px;font-weight:700}.demo-tag{padding:4px 7px;border-radius:5px;background:#243348;color:#8fb9ff;font-size:10px}.favorite-btn{width:42px;height:42px;border:1px solid #2b3948;border-radius:8px;background:#111923;color:#9ba8ba;font-size:24px;cursor:pointer}.favorite-btn.active{color:#ffd43b}.market-overview{margin-top:18px;display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:center}.latest-label,.mark-row,.feed-status,.market-stat-label{color:#758398;font-size:12px}.price-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.price{font-size:46px;line-height:1;font-weight:700;color:#24d79a}.price.red,.change24.red{color:#f25b68}.change24{font-size:20px;color:#24d79a}.mark-row{margin-top:9px}.mark-row span{color:#a7b1bf}.feed-status{margin-top:7px;font-size:10px}.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#f2b742;margin-right:5px}.status-dot.online{background:#24d79a}.status-dot.error{background:#f25b68}.market-stats{display:grid;gap:10px}.market-stat{display:grid;grid-template-columns:1fr auto;gap:18px}.market-stat-value{font-size:16px;text-align:right}.box{margin:13px;border:1px solid #202b37;border-radius:8px;background:#0e161f}.balance-box{padding:14px}.balance-label{font-size:11px;color:#718095}.balance{margin-top:5px;font-size:23px;font-weight:700}.chart-box{position:relative;height:440px;overflow:hidden;background:#0c1219}.kline-timeframes{height:44px;display:flex;align-items:center;gap:6px;padding:6px 8px;overflow-x:auto;border-bottom:1px solid #202b37;background:#0d141d}.kline-timeframes button{flex:0 0 auto;min-width:43px;height:30px;padding:0 9px;border:1px solid transparent;border-radius:6px;background:transparent;color:#8290a3;cursor:pointer}.kline-timeframes button.active{color:#57a8ff;background:#14243a;border-color:#294a6e}.indicator-btn{min-width:78px!important;border-color:#2b3d52!important;background:#111b27!important}.indicator-btn.active{color:#57a8ff!important;border-color:#315c8d!important;background:#13243a!important}#klineChart{width:100%;height:calc(100% - 44px)}#chartLoading{position:absolute;inset:44px 0 0 0;display:flex;align-items:center;justify-content:center;color:#7890ad;font-size:12px;pointer-events:none}.chart-tools{position:absolute;left:7px;top:54px;z-index:12;display:flex;flex-direction:column;gap:4px;padding:5px;border:1px solid #263240;border-radius:8px;background:rgba(13,20,29,.95)}.chart-tool{width:30px;height:30px;border:1px solid transparent;border-radius:6px;background:transparent;color:#a3afbe;cursor:pointer}.chart-tool.active,.chart-tool:hover{background:#182332;border-color:#33465d;color:#fff}#drawingCanvas{position:absolute;left:0;top:44px;width:100%;height:calc(100% - 44px);z-index:9;pointer-events:none;touch-action:none}.drawing-hint{position:absolute;left:50px;top:53px;z-index:11;display:none;padding:5px 8px;border-radius:5px;background:rgba(12,18,25,.9);font-size:10px;color:#aab7c7}.trade-box{padding:14px}.section-title{font-size:16px;font-weight:700;margin-bottom:14px}.field{margin-bottom:12px}.field label{display:block;font-size:11px;color:#718095;margin-bottom:6px}.input,.select{width:100%;height:44px;border:1px solid #2b3948;border-radius:7px;background:#101923;color:#fff;padding:0 12px;outline:none}.quick-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}.quick-row button{height:36px;border:1px solid #2b3948;border-radius:6px;background:#101923;color:#9ed1ff;cursor:pointer}.trade-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.trade-actions button{height:48px;border:0;border-radius:8px;color:#fff;font-weight:700;cursor:pointer}.up-btn{background:#169b70}.down-btn{background:#d84f5c}.order-status{margin-top:12px;padding:10px;border-radius:7px;background:#0b1219;color:#aab7c7;font-size:12px;display:none}.history{padding:14px}.history-row{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;padding:9px 0;border-bottom:1px solid #1c2733;font-size:12px}.win{color:#24d79a}.loss{color:#f25b68}.draw{color:#d3a94a}.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:64px;background:#0d141d;border-top:1px solid #202b38;display:grid;grid-template-columns:repeat(4,1fr);z-index:50}.bottom-nav a{display:flex;align-items:center;justify-content:center;color:#8290a3;text-decoration:none;font-size:12px}.bottom-nav a.active{color:#409cff}.chart-touch-lock{position:absolute;left:0;right:0;top:44px;bottom:0;z-index:8;background:transparent;touch-action:pan-y}.chart-touch-lock span{position:absolute;right:10px;top:10px;padding:5px 8px;border-radius:5px;background:rgba(12,18,25,.78);color:#8290a3;font-size:10px;opacity:.85;pointer-events:none}.chart-box.chart-active .chart-touch-lock{display:none}@media(max-width:650px){.market-overview{grid-template-columns:1fr 1fr;gap:12px}.price{font-size:34px}.change24{font-size:15px}.market-stat-value{font-size:13px}.chart-box{height:390px}.chart-tools{left:4px;top:50px;gap:2px;padding:3px;border-radius:6px}.chart-tool{width:23px;height:23px;min-width:23px;padding:0;font-size:10px;line-height:21px;border-radius:4px}#klineChart{touch-action:pan-y}.chart-box.chart-active #klineChart{touch-action:none}.quick-row{grid-template-columns:repeat(2,1fr)}}
</style>

<body>
<header class="header">
  <div class="header-top">
    <div class="pair-area"><span id="pairName" class="pair-name">BTC / USDT</span><span class="demo-tag">DEMO</span></div>
    <button id="favoriteBtn" class="favorite-btn" onclick="toggleFavorite()">☆</button>
  </div>
  <div class="market-overview">
    <div>
      <div class="latest-label">最新成交价</div>
      <div class="price-row"><div id="price" class="price">Loading...</div><div id="change24h" class="change24">--</div></div>
      <div class="mark-row">标记价格 <span id="markPrice">--</span></div>
      <div class="feed-status"><span id="connectionDot" class="status-dot"></span><span id="connectionText">Connecting...</span></div>
    </div>
    <div class="market-stats">
      <div class="market-stat"><span class="market-stat-label">24h最高</span><span id="high24h" class="market-stat-value">--</span></div>
      <div class="market-stat"><span class="market-stat-label">24h最低</span><span id="low24h" class="market-stat-value">--</span></div>
      <div class="market-stat"><span class="market-stat-label">24h交易额</span><span id="volume24h" class="market-stat-value">--</span></div>
    </div>
  </div>
</header>

<div class="box balance-box"><div class="balance-label">Demo Balance</div><div id="balance" class="balance">10000.00 USDT</div></div>

<div class="box chart-box" id="chartBox">
  <div class="kline-timeframes">
    <button data-interval="1m">1m</button><button data-interval="5m">5m</button><button data-interval="15m">15m</button><button data-interval="30m">30m</button><button data-interval="1h">1h</button><button data-interval="4h">4h</button><button data-interval="1d">1D</button>
    <button id="indicatorBtn" class="indicator-btn">Indicators</button>
  </div>
  <div id="klineChart"></div><div id="chartTouchLock" class="chart-touch-lock"><span>点击图表操作</span></div>
  <canvas id="drawingCanvas"></canvas>
  <div id="drawingHint" class="drawing-hint">Select two points</div>
  <div class="chart-tools">
    <button class="chart-tool active" data-tool="cursor" title="Cursor">⌖</button>
    <button class="chart-tool" data-tool="trend" title="Trend Line">／</button>
    <button class="chart-tool" data-tool="horizontal" title="Horizontal Line">—</button>
    <button class="chart-tool" data-tool="vertical" title="Vertical Line">│</button>
    <button class="chart-tool" data-tool="rectangle" title="Rectangle">□</button>
    <button class="chart-tool" data-tool="text" title="Text">T</button>
    <button class="chart-tool" data-tool="ruler" title="Ruler">↔</button>
    <button class="chart-tool" data-tool="clear" title="Clear">×</button>
  </div>
  <div id="chartLoading">Loading K-line chart...</div>
</div>

<div class="box trade-box">
  <div class="section-title">Second Contract</div>
  <div class="field"><label>Duration</label><select id="duration" class="select"><option value="30">30 Seconds</option><option value="60">60 Seconds</option><option value="120">120 Seconds</option><option value="180">180 Seconds</option><option value="240">240 Seconds</option></select></div>
  <div class="field"><label>Amount (USDT)</label><input id="amount" class="input" type="number" min="1" value="100" /></div>
  <div class="quick-row"><button onclick="setAmount(100)">100</button><button onclick="setAmount(500)">500</button><button onclick="setAmount(1000)">1000</button><button onclick="setAmount(5000)">5000</button></div>
  <div class="trade-actions"><button class="up-btn" onclick="placeOrder('UP')">UP</button><button class="down-btn" onclick="placeOrder('DOWN')">DOWN</button></div>
  <div id="orderStatus" class="order-status"></div>
</div>

<div class="box history"><div class="section-title">Demo History</div><div id="historyList"></div></div>

<nav class="bottom-nav"><a href="index.html">Markets</a><a class="active" href="trading.html">Trading</a><a href="assets.html">Assets</a><a href="#">Profile</a></nav>

<script>
const params=new URLSearchParams(location.search);const selectedSymbol=(params.get('symbol')||'BTC').toUpperCase();
const supported=['BTC','ETH','BNB','SOL','XRP','DOGE','ADA','TRX','AVAX','LINK','DOT','BCH','LTC','UNI','XLM','TON','SHIB','HBAR','SUI','APT','NEAR','ICP','ETC','FIL','ATOM','ARB','OP','AAVE','PEPE','POL'];
const symbol=supported.includes(selectedSymbol)?selectedSymbol:'BTC';
document.getElementById('pairName').textContent=symbol+' / USDT';
let balance=Number(localStorage.getItem('demoBalance'));if(!Number.isFinite(balance))balance=10000;let currentPrice=null,lastPrice=null;let chart,candleSeries,klineSocket,tradeSocket,tickerSocket;let candleData=[];let currentInterval=localStorage.getItem('klineInterval')||'15m';
const intervals={"1m":"1m","5m":"5m","15m":"15m","30m":"30m","1h":"1h","4h":"4h","1d":"1d"};
function fmtPrice(v){v=Number(v);if(!Number.isFinite(v))return'--';if(v>=1000)return v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});if(v>=1)return v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:4});return v.toPrecision(6)}
function fmtVol(v){v=Number(v);if(!Number.isFinite(v))return'--';if(v>=1e9)return(v/1e9).toFixed(2)+'B';if(v>=1e6)return(v/1e6).toFixed(2)+'M';if(v>=1e3)return(v/1e3).toFixed(2)+'K';return v.toFixed(2)}
function saveBalance(){localStorage.setItem('demoBalance',String(balance));document.getElementById('balance').textContent=balance.toFixed(2)+' USDT'}saveBalance();
function updatePrice(p){p=Number(p);if(!Number.isFinite(p)||p<=0)return;lastPrice=currentPrice;currentPrice=p;const el=document.getElementById('price');el.textContent=fmtPrice(p);el.classList.toggle('red',lastPrice!==null&&p<lastPrice);document.getElementById('markPrice').textContent=fmtPrice(p);document.getElementById('connectionDot').className='status-dot online';document.getElementById('connectionText').textContent='Live'}
function update24(h,l,q,pct){document.getElementById('high24h').textContent=fmtPrice(h);document.getElementById('low24h').textContent=fmtPrice(l);document.getElementById('volume24h').textContent=fmtVol(q);const c=document.getElementById('change24h');pct=Number(pct);if(Number.isFinite(pct)){c.textContent=(pct>=0?'+':'')+pct.toFixed(2)+'%';c.classList.toggle('red',pct<0)}}
function connectPrice(){if(tradeSocket)try{tradeSocket.close()}catch(e){};tradeSocket=new WebSocket('wss://stream.binance.com:9443/ws/'+symbol.toLowerCase()+'usdt@trade');tradeSocket.onmessage=e=>{try{updatePrice(JSON.parse(e.data).p)}catch(_){}};tradeSocket.onclose=()=>setTimeout(connectPrice,2500);tradeSocket.onerror=()=>{try{tradeSocket.close()}catch(e){}}}
function connect24(){if(tickerSocket)try{tickerSocket.close()}catch(e){};tickerSocket=new WebSocket('wss://stream.binance.com:9443/ws/'+symbol.toLowerCase()+'usdt@ticker');tickerSocket.onmessage=e=>{try{const d=JSON.parse(e.data);update24(d.h,d.l,d.q,d.P);if(!currentPrice)updatePrice(d.c)}catch(_){}};tickerSocket.onclose=()=>setTimeout(connect24,2500);tickerSocket.onerror=()=>{try{tickerSocket.close()}catch(e){}}}
async function restPriceFallback(){try{const r=await fetch('https://data-api.binance.vision/api/v3/ticker/price?symbol='+symbol+'USDT',{cache:'no-store'});const d=await r.json();updatePrice(d.price)}catch(e){}}
function createChart(){const host=document.getElementById('klineChart');chart=LightweightCharts.createChart(host,{width:host.clientWidth,height:host.clientHeight,layout:{background:{type:'solid',color:'#0c1219'},textColor:'#7f8c9d'},grid:{vertLines:{color:'#18232e'},horzLines:{color:'#18232e'}},rightPriceScale:{borderColor:'#27313c'},timeScale:{borderColor:'#27313c',timeVisible:true,secondsVisible:false,barSpacing:8,minBarSpacing:5,rightOffset:4},crosshair:{mode:LightweightCharts.CrosshairMode.Normal}});candleSeries=chart.addCandlestickSeries({upColor:'#24d79a',downColor:'#f25b68',borderUpColor:'#24d79a',borderDownColor:'#f25b68',wickUpColor:'#24d79a',wickDownColor:'#f25b68'});new ResizeObserver(()=>{chart.applyOptions({width:host.clientWidth,height:host.clientHeight});resizeCanvas()}).observe(host)}
const chartBox=document.getElementById('chartBox'),chartTouchLock=document.getElementById('chartTouchLock');function setChartInteraction(active){if(!chartBox)return;chartBox.classList.toggle('chart-active',active);if(chart)chart.applyOptions({handleScroll:{mouseWheel:active,pressedMouseMove:active,horzTouchDrag:active,vertTouchDrag:active},handleScale:{axisPressedMouseMove:active,mouseWheel:active,pinch:active}})}if(chartTouchLock)chartTouchLock.addEventListener('click',()=>setChartInteraction(true));document.addEventListener('pointerdown',e=>{if(window.innerWidth<=650&&chartBox&&!chartBox.contains(e.target))setChartInteraction(false)});window.addEventListener('resize',()=>{if(window.innerWidth<=650)setChartInteraction(false);else setChartInteraction(true)});async function fetchKlines(){const q='?symbol='+symbol+'USDT&interval='+intervals[currentInterval]+'&limit=300';const hosts=['https://data-api.binance.vision/api/v3/klines','https://api.binance.com/api/v3/klines','https://api1.binance.com/api/v3/klines','https://api2.binance.com/api/v3/klines','https://api3.binance.com/api/v3/klines'];for(const h of hosts){try{const c=new AbortController();const t=setTimeout(()=>c.abort(),4500);const r=await fetch(h+q,{cache:'no-store',signal:c.signal});clearTimeout(t);if(!r.ok)continue;const raw=await r.json();const arr=raw.map(x=>({time:Math.floor(+x[0]/1000),open:+x[1],high:+x[2],low:+x[3],close:+x[4]})).filter(x=>Number.isFinite(x.close)&&x.close>0);if(arr.length){localStorage.setItem('klineCache_'+symbol+'_'+currentInterval,JSON.stringify(arr));return arr}}catch(e){}}try{return JSON.parse(localStorage.getItem('klineCache_'+symbol+'_'+currentInterval)||'[]')}catch(e){return[]}}
async function loadKlines(){document.getElementById('chartLoading').style.display='flex';const data=await fetchKlines();if(data.length){candleData=data;candleSeries.setData(data);chart.timeScale().setVisibleLogicalRange({from:Math.max(0,data.length-72),to:data.length+3});document.getElementById('chartLoading').style.display='none';refreshIndicators()}else{document.getElementById('chartLoading').textContent='Historical K-line unavailable — realtime price still connected'}}
function connectKline(){if(klineSocket)try{klineSocket.close()}catch(e){};klineSocket=new WebSocket('wss://stream.binance.com:9443/ws/'+symbol.toLowerCase()+'usdt@kline_'+intervals[currentInterval]);klineSocket.onmessage=e=>{try{const k=JSON.parse(e.data).k;const c={time:Math.floor(+k.t/1000),open:+k.o,high:+k.h,low:+k.l,close:+k.c};candleSeries.update(c);updateLiveCandleData(c);updatePrice(c.close);redraw()}catch(_){}};klineSocket.onclose=()=>setTimeout(connectKline,2500);klineSocket.onerror=()=>{try{klineSocket.close()}catch(e){}}}
function updateLiveCandleData(c){const i=candleData.length-1;if(i>=0&&candleData[i].time===c.time)candleData[i]=c;else if(i<0||c.time>candleData[i].time){candleData.push(c);if(candleData.length>300)candleData.shift()}if(indicatorsEnabled)refreshIndicators()}
async function setIntervalKline(v){currentInterval=v;localStorage.setItem('klineInterval',v);document.querySelectorAll('[data-interval]').forEach(b=>b.classList.toggle('active',b.dataset.interval===v));await loadKlines();connectKline();redraw()}
document.querySelectorAll('[data-interval]').forEach(b=>b.onclick=()=>setIntervalKline(b.dataset.interval));

let sma5=null,sma20=null,indicatorsEnabled=false;function sma(period){const out=[];let sum=0;for(let i=0;i<candleData.length;i++){sum+=candleData[i].close;if(i>=period)sum-=candleData[i-period].close;if(i>=period-1)out.push({time:candleData[i].time,value:sum/period})}return out}function refreshIndicators(){if(!chart)return;if(!sma5)sma5=chart.addLineSeries({color:'#f1c75b',lineWidth:1,priceLineVisible:false,lastValueVisible:false});if(!sma20)sma20=chart.addLineSeries({color:'#8c7cff',lineWidth:1,priceLineVisible:false,lastValueVisible:false});sma5.setData(indicatorsEnabled?sma(5):[]);sma20.setData(indicatorsEnabled?sma(20):[])}document.getElementById('indicatorBtn').onclick=()=>{indicatorsEnabled=!indicatorsEnabled;document.getElementById('indicatorBtn').classList.toggle('active',indicatorsEnabled);document.getElementById('indicatorBtn').textContent=indicatorsEnabled?'MA 5 / 20':'Indicators';refreshIndicators()};

const canvas=document.getElementById('drawingCanvas'),ctx=canvas.getContext('2d'),hint=document.getElementById('drawingHint');let tool='cursor',startPoint=null,preview=null,drawings=[];function resizeCanvas(){const r=document.getElementById('klineChart').getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=Math.max(1,Math.round(r.width*d));canvas.height=Math.max(1,Math.round(r.height*d));ctx.setTransform(d,0,0,d,0,0);redraw()}function eventPoint(e){const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,t=chart.timeScale().coordinateToTime(x),p=candleSeries.coordinateToPrice(y);if(t==null||!Number.isFinite(+p))return null;return{time:typeof t==='number'?t:null,price:+p}}function coord(p){if(!p||p.time==null)return null;const x=chart.timeScale().timeToCoordinate(p.time),y=candleSeries.priceToCoordinate(p.price);return x==null||y==null?null:{x,y}}function drawOne(d,ghost=false){ctx.save();ctx.strokeStyle=ghost?'rgba(113,179,255,.7)':'#5baeff';ctx.fillStyle='rgba(91,174,255,.12)';ctx.lineWidth=ghost?1:1.4;ctx.font='12px Arial';if(d.type==='horizontal'){const y=candleSeries.priceToCoordinate(d.price);if(y!=null){ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.clientWidth,y);ctx.stroke()}ctx.restore();return}if(d.type==='vertical'){const x=chart.timeScale().timeToCoordinate(d.time);if(x!=null){ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.clientHeight);ctx.stroke()}ctx.restore();return}const a=coord(d.a),b=coord(d.b);if(d.type==='text'){if(a){ctx.fillStyle='#dce6f3';ctx.fillText(d.text,a.x+4,a.y-6)}ctx.restore();return}if(!a||!b){ctx.restore();return}if(d.type==='trend'){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}if(d.type==='rectangle'){const x=Math.min(a.x,b.x),y=Math.min(a.y,b.y),w=Math.abs(b.x-a.x),h=Math.abs(b.y-a.y);ctx.fillRect(x,y,w,h);ctx.strokeRect(x,y,w,h)}if(d.type==='ruler'){ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();const ch=d.b.price-d.a.price,p=d.a.price?ch/d.a.price*100:0,label=(ch>=0?'+':'')+ch.toFixed(2)+' ('+(p>=0?'+':'')+p.toFixed(2)+'%)';ctx.setLineDash([]);ctx.fillStyle='rgba(12,18,25,.9)';ctx.fillRect((a.x+b.x)/2-55,(a.y+b.y)/2-20,110,18);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(label,(a.x+b.x)/2,(a.y+b.y)/2-7)}ctx.restore()}function redraw(){ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);drawings.forEach(d=>drawOne(d));if(preview)drawOne(preview,true)}function setTool(t){if(t==='clear'){drawings=[];preview=null;startPoint=null;setTool('cursor');redraw();return}tool=t;startPoint=null;preview=null;document.querySelectorAll('.chart-tool').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));canvas.style.pointerEvents=t==='cursor'?'none':'auto';canvas.style.cursor=t==='cursor'?'default':'crosshair';hint.style.display=t==='cursor'?'none':'block';hint.textContent=['trend','rectangle','ruler'].includes(t)?'Select two points':t==='text'?'Tap chart to add text':'Tap chart to place';redraw()}document.querySelectorAll('.chart-tool').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));canvas.addEventListener('pointerdown',e=>{if(tool==='cursor')return;const p=eventPoint(e);if(!p||p.time==null)return;if(tool==='horizontal'){drawings.push({type:'horizontal',price:p.price});redraw();return}if(tool==='vertical'){drawings.push({type:'vertical',time:p.time});redraw();return}if(tool==='text'){const s=prompt('Text:','');if(s&&s.trim()){drawings.push({type:'text',a:p,b:p,text:s.trim()});redraw()}return}if(!startPoint){startPoint=p;preview={type:tool,a:p,b:p};redraw();return}drawings.push({type:tool,a:startPoint,b:p});startPoint=null;preview=null;redraw()});canvas.addEventListener('pointermove',e=>{if(!startPoint||!['trend','rectangle','ruler'].includes(tool))return;const p=eventPoint(e);if(p){preview={type:tool,a:startPoint,b:p};redraw()}});

function toggleFavorite(){let arr=[];try{arr=JSON.parse(localStorage.getItem('marketFavorites')||'[]')}catch(e){};arr=Array.isArray(arr)?arr:[];if(arr.includes(symbol))arr=arr.filter(x=>x!==symbol);else arr.push(symbol);localStorage.setItem('marketFavorites',JSON.stringify(arr));updateFavorite()}function updateFavorite(){let arr=[];try{arr=JSON.parse(localStorage.getItem('marketFavorites')||'[]')}catch(e){};const on=Array.isArray(arr)&&arr.includes(symbol),b=document.getElementById('favoriteBtn');b.textContent=on?'★':'☆';b.classList.toggle('active',on)}updateFavorite();
function setAmount(v){document.getElementById('amount').value=v}let activeOrder=null;function placeOrder(side){if(activeOrder)return alert('已有订单进行中');const amount=Number(document.getElementById('amount').value),duration=Number(document.getElementById('duration').value);if(!currentPrice)return alert('价格还没加载');if(!Number.isFinite(amount)||amount<=0)return alert('请输入正确金额');if(amount>balance)return alert('Demo Balance 不足');balance-=amount;saveBalance();const entry=currentPrice,end=Date.now()+duration*1000;activeOrder={side,amount,duration,entry,end};const box=document.getElementById('orderStatus');box.style.display='block';const timer=setInterval(()=>{const left=Math.max(0,Math.ceil((end-Date.now())/1000));box.textContent=side+' | Entry '+fmtPrice(entry)+' | '+left+'s';if(left<=0){clearInterval(timer);finishOrder()}},250)}function finishOrder(){if(!activeOrder)return;const o=activeOrder,exit=currentPrice||o.entry;let result='DRAW',pnl=0;if(o.side==='UP'){if(exit>o.entry){result='WIN';pnl=o.amount*.8}else if(exit<o.entry)result='LOSS'}else{if(exit<o.entry){result='WIN';pnl=o.amount*.8}else if(exit>o.entry)result='LOSS'}if(result==='WIN')balance+=o.amount+pnl;if(result==='DRAW')balance+=o.amount;saveBalance();let h=[];try{h=JSON.parse(localStorage.getItem('demoHistory')||'[]')}catch(e){};if(!Array.isArray(h))h=[];h.unshift({time:Date.now(),symbol,side:o.side,amount:o.amount,entry:o.entry,exit,result,pnl:result==='WIN'?pnl:result==='LOSS'?-o.amount:0});h=h.slice(0,100);localStorage.setItem('demoHistory',JSON.stringify(h));document.getElementById('orderStatus').textContent=result+' | Exit '+fmtPrice(exit)+' | P/L '+(result==='WIN'?'+':'')+(result==='DRAW'?0:(result==='WIN'?pnl:-o.amount)).toFixed(2)+' USDT';activeOrder=null;renderHistory()}function renderHistory(){let h=[];try{h=JSON.parse(localStorage.getItem('demoHistory')||'[]')}catch(e){};if(!Array.isArray(h)||!h.length){document.getElementById('historyList').innerHTML='<div style="color:#718095;font-size:12px">No demo trades yet.</div>';return}document.getElementById('historyList').innerHTML=h.slice(0,20).map(x=>'<div class="history-row"><span>'+x.symbol+' '+x.side+'</span><span>'+x.amount.toFixed(2)+'</span><span>'+x.result+'</span><span class="'+(x.result==='WIN'?'win':x.result==='LOSS'?'loss':'draw')+'">'+(x.pnl>0?'+':'')+x.pnl.toFixed(2)+'</span></div>').join('')}renderHistory();

(async function init(){try{createChart();if(window.innerWidth<=650)setChartInteraction(false);else setChartInteraction(true);resizeCanvas();chart.timeScale().subscribeVisibleLogicalRangeChange(redraw);window.addEventListener('resize',resizeCanvas);document.querySelectorAll('[data-interval]').forEach(b=>b.classList.toggle('active',b.dataset.interval===currentInterval));connect24();connectPrice();restPriceFallback();await loadKlines();connectKline()}catch(e){console.error(e);document.getElementById('chartLoading').textContent='K-line initialization error';document.getElementById('connectionDot').className='status-dot error';document.getElementById('connectionText').textContent='Fallback mode';restPriceFallback()}})();
