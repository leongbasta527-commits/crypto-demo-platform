<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markets</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080d13;
    color: #eef3f8;
    font-family: Arial, Helvetica, sans-serif;
    padding-bottom: 68px;
}

header {
    padding: 18px 16px 14px;
    border-bottom: 1px solid #202a35;
    background: #0c1219;
}

.header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

h1 {
    margin: 0;
    font-size: 25px;
}

.subtitle {
    font-size: 11px;
    color: #748196;
    margin-top: 5px;
}

.status {
    font-size: 11px;
    color: #f5b942;
}

.status.online {
    color: #25d695;
}

.status.error {
    color: #f25c69;
}

.search {
    width: 100%;
    height: 42px;
    margin-top: 16px;
    padding: 0 14px;
    border-radius: 7px;
    border: 1px solid #273342;
    background: #111923;
    color: white;
    outline: none;
}

.tabs {
    display: flex;
    gap: 8px;
    padding: 12px 14px;
    border-bottom: 1px solid #202a35;
}

.tab {
    flex: 1;
    max-width: 120px;
    height: 36px;
    border: 1px solid #283546;
    border-radius: 7px;
    background: #0e151e;
    color: #a0acbc;
    cursor: pointer;
}

.tab.active {
    background: #287cff;
    color: white;
    border-color: #287cff;
}

.table-wrap {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 1050px;
}

thead {
    background: #0f1720;
}

th {
    height: 42px;
    padding: 0 12px;
    font-size: 11px;
    font-weight: 500;
    color: #728196;
    text-align: right;
    white-space: nowrap;
}

th:first-child {
    text-align: left;
    padding-left: 16px;
}

td {
    height: 62px;
    padding: 0 12px;
    font-size: 13px;
    text-align: right;
    border-bottom: 1px solid #17212c;
    white-space: nowrap;
}

td:first-child {
    text-align: left;
    padding-left: 16px;
}

tr.market-row {
    cursor: pointer;
}

tr.market-row:hover {
    background: #101821;
}

.coin {
    display: flex;
    align-items: center;
    gap: 10px;
}

.coin img {
    width: 31px;
    height: 31px;
    border-radius: 50%;
}

.coin-symbol {
    font-weight: 700;
}

.coin-name {
    color: #718097;
    font-size: 10px;
    margin-top: 3px;
}

.green {
    color: #24d79a;
}

.red {
    color: #f25b68;
}

.loading {
    text-align: center;
    padding: 55px 20px;
    color: #738198;
}

.note {
    margin: 15px;
    padding: 11px 13px;
    border: 1px solid #202b38;
    border-radius: 7px;
    background: #0d151e;
    color: #68788e;
    font-size: 10px;
}

canvas {
    width: 90px;
    height: 34px;
}

.bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 64px;
    display: grid;
    grid-template-columns: repeat(4,1fr);
    background: #0d141d;
    border-top: 1px solid #25303c;
}

.bottom-nav a {
    color: #7f8ba0;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
}

.bottom-nav a.active {
    color: #3388ff;
}

@media (max-width: 700px) {

    table {
        min-width: 0;
    }

    .desktop-only {
        display: none;
    }

    th,
    td {
        padding-left: 5px;
        padding-right: 5px;
        font-size: 10px;
    }

    th:first-child,
    td:first-child {
        padding-left: 8px;
    }

    .coin img {
        width: 27px;
        height: 27px;
    }

    .coin-name {
        max-width: 65px;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    canvas {
        width: 65px;
        height: 30px;
    }

}
</style>
</head>

<body>

<header>
    <div class="header-top">

        <div>
            <h1>Markets</h1>
            <div class="subtitle">
                Crypto market · Demo platform
            </div>
        </div>

        <div id="status" class="status">
            ● Loading
        </div>

    </div>

    <input
        id="search"
        class="search"
        placeholder="Search coin or symbol..."
    >
</header>

<div class="tabs">
    <button class="tab" id="favTab">★ Favorites</button>
    <button class="tab active" id="spotTab">Spot</button>
    <button class="tab" id="derivativesTab">Derivatives</button>
</div>

<div class="table-wrap">

<table>
<thead>
<tr>
    <th>Coin</th>
    <th>Last Price</th>
    <th>Change 24h</th>
    <th class="desktop-only">High 24h</th>
    <th class="desktop-only">Low 24h</th>
    <th class="desktop-only">Volume 24h</th>
    <th>Chart 24h</th>
</tr>
</thead>

<tbody id="marketBody">
<tr>
<td colspan="7">
    <div class="loading">
        Loading market data...
    </div>
</td>
</tr>
</tbody>
</table>

</div>

<div class="note">
    DEMO ONLY. Market information is for reference only.
    No real-money trading is processed on this website.
</div>

<nav class="bottom-nav">
    <a href="index.html" class="active">Markets</a>
    <a href="trading.html?symbol=BTC">Trading</a>
    <a href="assets.html">Assets</a>
    <a href="profile.html">Profile</a>
</nav>

<script>

const COINS = [
    ["bitcoin","BTC"],
    ["ethereum","ETH"],
    ["binancecoin","BNB"],
    ["solana","SOL"],
    ["ripple","XRP"],
    ["dogecoin","DOGE"],
    ["cardano","ADA"],
    ["tron","TRX"],
    ["avalanche-2","AVAX"],
    ["chainlink","LINK"],
    ["polkadot","DOT"],
    ["bitcoin-cash","BCH"],
    ["litecoin","LTC"],
    ["uniswap","UNI"],
    ["stellar","XLM"],
    ["the-open-network","TON"],
    ["shiba-inu","SHIB"],
    ["hedera-hashgraph","HBAR"],
    ["sui","SUI"],
    ["aptos","APT"],
    ["near","NEAR"],
    ["internet-computer","ICP"],
    ["ethereum-classic","ETC"],
    ["filecoin","FIL"],
    ["cosmos","ATOM"],
    ["arbitrum","ARB"],
    ["optimism","OP"],
    ["aave","AAVE"],
    ["pepe","PEPE"],
    ["matic-network","POL"]
];

const ids =
    COINS.map(x => x[0]).join(",");

const API =
    "https://api.coingecko.com/api/v3/coins/markets" +
    "?vs_currency=usd" +
    "&ids=" + ids +
    "&sparkline=true" +
    "&price_change_percentage=24h";

let marketData = [];

let currentMode = "spot";

let favorites =
    JSON.parse(
        localStorage.getItem("marketFavorites") || "[]"
    );

async function loadMarkets() {

    const status =
        document.getElementById("status");

    status.className = "status";
    status.innerText = "● Loading";

    try {

        const response =
            await fetch(API, {
                cache: "no-store"
            });

        if (!response.ok) {
            throw new Error("API error");
        }

        const data =
            await response.json();

        if (!Array.isArray(data)) {
            throw new Error("Invalid data");
        }

        const order = {};

        COINS.forEach((item,index) => {
            order[item[0]] = index;
        });

        data.sort((a,b) =>
            order[a.id] - order[b.id]
        );

        marketData = data;

        localStorage.setItem(
            "cachedMarketData",
            JSON.stringify(data)
        );

        renderMarkets();

        status.className =
            "status online";

        status.innerText =
            "● Live";

    } catch (error) {

        const cached =
            JSON.parse(
                localStorage.getItem(
                    "cachedMarketData"
                ) || "[]"
            );

        if (cached.length) {

            marketData = cached;

            renderMarkets();

            status.className = "status";

            status.innerText =
                "● Cached";

        } else {

            status.className =
                "status error";

            status.innerText =
                "● Unavailable";

            document
                .getElementById("marketBody")
                .innerHTML =
                `
                <tr>
                    <td colspan="7">
                        <div class="loading">
                            Market data temporarily unavailable.
                            Refresh again later.
                        </div>
                    </td>
                </tr>
                `;
        }
    }
}

function renderMarkets() {

    const body =
        document.getElementById(
            "marketBody"
        );

    const keyword =
        document
            .getElementById("search")
            .value
            .trim()
            .toLowerCase();

    let data =
        [...marketData];

    if (
        currentMode ===
        "favorites"
    ) {
        data =
            data.filter(
                coin =>
                    favorites.includes(
                        coin.symbol.toUpperCase()
                    )
            );
    }

    if (keyword) {

        data =
            data.filter(
                coin =>
                    coin.name
                        .toLowerCase()
                        .includes(keyword)
                    ||
                    coin.symbol
                        .toLowerCase()
                        .includes(keyword)
            );
    }

    if (!data.length) {

        body.innerHTML =
            `
            <tr>
                <td colspan="7">
                    <div class="loading">
                        No coins found.
                    </div>
                </td>
            </tr>
            `;

        return;
    }

    body.innerHTML = "";

    data.forEach(coin => {

        const change =
            Number(
                coin.price_change_percentage_24h
            );

        const row =
            document.createElement("tr");

        row.className =
            "market-row";

        row.onclick =
            function () {

                window.location.href =
                    "trading.html?symbol=" +
                    coin.symbol.toUpperCase();

            };

        row.innerHTML = `
            <td>
                <div class="coin">
                    <img
                        src="${coin.image}"
                        alt="${coin.symbol}"
                    >

                    <div>
                        <div class="coin-symbol">
                            ${coin.symbol.toUpperCase()}
                        </div>

                        <div class="coin-name">
                            ${coin.name}
                        </div>
                    </div>
                </div>
            </td>

            <td>
                ${formatPrice(coin.current_price)}
            </td>

            <td class="${change >= 0 ? "green":"red"}">
                ${formatChange(change)}
            </td>

            <td class="desktop-only">
                ${formatPrice(coin.high_24h)}
            </td>

            <td class="desktop-only">
                ${formatPrice(coin.low_24h)}
            </td>

            <td class="desktop-only">
                ${formatVolume(coin.total_volume)}
            </td>

            <td>
                <canvas
                    id="chart_${coin.id}"
                    width="100"
                    height="36"
                ></canvas>
            </td>
        `;

        body.appendChild(row);

        const prices =
            coin.sparkline_in_7d &&
            coin.sparkline_in_7d.price
                ? coin.sparkline_in_7d.price
                : [];

        const last24 =
            prices.slice(
                -Math.max(
                    12,
                    Math.round(
                        prices.length / 7
                    )
                )
            );

        drawChart(
            "chart_" + coin.id,
            last24,
            change
        );

    });

}

function drawChart(
    id,
    values,
    change
) {

    const canvas =
        document.getElementById(id);

    if (
        !canvas ||
        values.length < 2
    ) {
        return;
    }

    const ctx =
        canvas.getContext("2d");

    const w =
        canvas.width;

    const h =
        canvas.height;

    const min =
        Math.min(...values);

    const max =
        Math.max(...values);

    const range =
        max - min || 1;

    ctx.clearRect(
        0,0,w,h
    );

    ctx.beginPath();

    values.forEach(
        (value,index) => {

            const x =
                index /
                (values.length - 1)
                * (w - 6) + 3;

            const y =
                h - 3 -
                (
                    (value - min) /
                    range
                )
                * (h - 6);

            if (index === 0) {
                ctx.moveTo(x,y);
            } else {
                ctx.lineTo(x,y);
            }

        }
    );

    ctx.strokeStyle =
        change >= 0
            ? "#24d79a"
            : "#f25b68";

    ctx.lineWidth = 2;
    ctx.stroke();
}

function formatPrice(value) {

    const n =
        Number(value);

    if (!Number.isFinite(n)) {
        return "--";
    }

    if (n >= 1000) {
        return "$" +
            n.toLocaleString(
                undefined,
                {
                    minimumFractionDigits:2,
                    maximumFractionDigits:2
                }
            );
    }

    if (n >= 1) {
        return "$" +
            n.toFixed(4);
    }

    if (n >= 0.01) {
        return "$" +
            n.toFixed(5);
    }

    return "$" +
        n.toFixed(8);
}

function formatChange(value) {

    if (!Number.isFinite(value)) {
        return "--";
    }

    return (
        value >= 0
            ? "+"
            : ""
    ) +
    value.toFixed(2) +
    "%";
}

function formatVolume(value) {

    const n =
        Number(value);

    if (!Number.isFinite(n)) {
        return "--";
    }

    if (n >= 1e9) {
        return "$" +
            (n / 1e9)
                .toFixed(2) +
            "B";
    }

    if (n >= 1e6) {
        return "$" +
            (n / 1e6)
                .toFixed(2) +
            "M";
    }

    return "$" +
        n.toLocaleString();
}

document
    .getElementById("search")
    .addEventListener(
        "input",
        renderMarkets
    );

document
    .getElementById("spotTab")
    .onclick =
    function () {

        currentMode = "spot";

        document
            .querySelectorAll(".tab")
            .forEach(
                x =>
                    x.classList
                        .remove("active")
            );

        this.classList.add("active");

        renderMarkets();
    };

document
    .getElementById("favTab")
    .onclick =
    function () {

        currentMode =
            "favorites";

        document
            .querySelectorAll(".tab")
            .forEach(
                x =>
                    x.classList
                        .remove("active")
            );

        this.classList.add("active");

        renderMarkets();
    };

document
    .getElementById(
        "derivativesTab"
    )
    .onclick =
    function () {

        alert(
            "Demo derivatives market will be added later."
        );
    };

loadMarkets();

setInterval(
    loadMarkets,
    60000
);

</script>

<script src="floating-widget.js?v=20"></script>
</body>
</html>
