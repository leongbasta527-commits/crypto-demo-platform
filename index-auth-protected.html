<script>
/* ===== Customer authentication gate ===== */
window.__customerAuthReady = (async function () {
    const SUPABASE_URL = "https://cyvquivolvkxzcseyhvk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_dy2_qtfTrOjeD-kPKohHiQ_zKHxZEHU";

    const authClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    const { data, error } = await authClient.auth.getSession();

    if (error || !data || !data.session || !data.session.user) {
        window.location.replace("login.html");
        return false;
    }

    const user = data.session.user;

    const { data: profile, error: profileError } =
        await authClient
            .from("customer_profiles")
            .select("uid,email,account_score")
            .eq("auth_user_id", user.id)
            .single();

    if (profileError || !profile || !profile.uid) {
        await authClient.auth.signOut();
        window.location.replace("login.html");
        return false;
    }

    /* Keep compatibility with the current customer pages. */
    localStorage.setItem("demoUid", profile.uid);
    localStorage.setItem("demoCustomerUid", profile.uid);
    localStorage.setItem("customerEmail", profile.email || user.email || "");
    localStorage.setItem(
        "demoAccountScore",
        String(profile.account_score ?? 100)
    );

    window.customerAuth = {
        client: authClient,
        user: user,
        profile: profile
    };

    document.documentElement.classList.add("auth-ready");
    return true;
})();
</script>

<script>

const COINS = [
    ["bitcoin","BTC"],
    ["ethereum","ETH"],
    ["binancecoin","BNB"],
    ["solana","SOL"],
    ["ripple","XRP"],
    ["dogecoin","DOGE"],
    ["cardano","ADA"],
    ["tron","TRX"],
    ["avalanche-2","AVAX"],
    ["chainlink","LINK"],
    ["polkadot","DOT"],
    ["bitcoin-cash","BCH"],
    ["litecoin","LTC"],
    ["uniswap","UNI"],
    ["stellar","XLM"],
    ["the-open-network","TON"],
    ["shiba-inu","SHIB"],
    ["hedera-hashgraph","HBAR"],
    ["sui","SUI"],
    ["aptos","APT"],
    ["near","NEAR"],
    ["internet-computer","ICP"],
    ["ethereum-classic","ETC"],
    ["filecoin","FIL"],
    ["cosmos","ATOM"],
    ["arbitrum","ARB"],
    ["optimism","OP"],
    ["aave","AAVE"],
    ["pepe","PEPE"],
    ["matic-network","POL"]
];

const ids =
    COINS.map(x => x[0]).join(",");

const API =
    "https://api.coingecko.com/api/v3/coins/markets" +
    "?vs_currency=usd" +
    "&ids=" + ids +
    "&sparkline=true" +
    "&price_change_percentage=24h";

let marketData = [];

let currentMode = "spot";

let favorites =
    JSON.parse(
        localStorage.getItem("marketFavorites") || "[]"
    );

async function loadMarkets() {

    const status =
        document.getElementById("status");

    status.className = "status";
    status.innerText = "● Loading";

    try {

        const response =
            await fetch(API, {
                cache: "no-store"
            });

        if (!response.ok) {
            throw new Error("API error");
        }

        const data =
            await response.json();

        if (!Array.isArray(data)) {
            throw new Error("Invalid data");
        }

        const order = {};

        COINS.forEach((item,index) => {
            order[item[0]] = index;
        });

        data.sort((a,b) =>
            order[a.id] - order[b.id]
        );

        marketData = data;

        localStorage.setItem(
            "cachedMarketData",
            JSON.stringify(data)
        );

        renderMarkets();

        status.className =
            "status online";

        status.innerText =
            "● Live";

    } catch (error) {

        const cached =
            JSON.parse(
                localStorage.getItem(
                    "cachedMarketData"
                ) || "[]"
            );

        if (cached.length) {

            marketData = cached;

            renderMarkets();

            status.className = "status";

            status.innerText =
                "● Cached";

        } else {

            status.className =
                "status error";

            status.innerText =
                "● Unavailable";

            document
                .getElementById("marketBody")
                .innerHTML =
                `
                <tr>
                    <td colspan="7">
                        <div class="loading">
                            Market data temporarily unavailable.
                            Refresh again later.
                        </div>
                    </td>
                </tr>
                `;
        }
    }
}

function renderMarkets() {

    const body =
        document.getElementById(
            "marketBody"
        );

    const keyword =
        document
            .getElementById("search")
            .value
            .trim()
            .toLowerCase();

    let data =
        [...marketData];

    if (
        currentMode ===
        "favorites"
    ) {
        data =
            data.filter(
                coin =>
                    favorites.includes(
                        coin.symbol.toUpperCase()
                    )
            );
    }

    if (keyword) {

        data =
            data.filter(
                coin =>
                    coin.name
                        .toLowerCase()
                        .includes(keyword)
                    ||
                    coin.symbol
                        .toLowerCase()
                        .includes(keyword)
            );
    }

    if (!data.length) {

        body.innerHTML =
            `
            <tr>
                <td colspan="7">
                    <div class="loading">
                        No coins found.
                    </div>
                </td>
            </tr>
            `;

        return;
    }

    body.innerHTML = "";

    data.forEach(coin => {

        const change =
            Number(
                coin.price_change_percentage_24h
            );

        const row =
            document.createElement("tr");

        row.className =
            "market-row";

        row.onclick =
            function () {

                window.location.href =
                    "trading.html?symbol=" +
                    coin.symbol.toUpperCase();

            };

        row.innerHTML = `
            <td>
                <div class="coin">
                    <img
                        src="${coin.image}"
                        alt="${coin.symbol}"
                    >

                    <div>
                        <div class="coin-symbol">
                            ${coin.symbol.toUpperCase()}
                        </div>

                        <div class="coin-name">
                            ${coin.name}
                        </div>
                    </div>
                </div>
            </td>

            <td>
                ${formatPrice(coin.current_price)}
            </td>

            <td class="${change >= 0 ? "green":"red"}">
                ${formatChange(change)}
            </td>

            <td class="desktop-only">
                ${formatPrice(coin.high_24h)}
            </td>

            <td class="desktop-only">
                ${formatPrice(coin.low_24h)}
            </td>

            <td class="desktop-only">
                ${formatVolume(coin.total_volume)}
            </td>

            <td>
                <canvas
                    id="chart_${coin.id}"
                    width="100"
                    height="36"
                ></canvas>
            </td>
        `;

        body.appendChild(row);

        const prices =
            coin.sparkline_in_7d &&
            coin.sparkline_in_7d.price
                ? coin.sparkline_in_7d.price
                : [];

        const last24 =
            prices.slice(
                -Math.max(
                    12,
                    Math.round(
                        prices.length / 7
                    )
                )
            );

        drawChart(
            "chart_" + coin.id,
            last24,
            change
        );

    });

}

function drawChart(
    id,
    values,
    change
) {

    const canvas =
        document.getElementById(id);

    if (
        !canvas ||
        values.length < 2
    ) {
        return;
    }

    const ctx =
        canvas.getContext("2d");

    const w =
        canvas.width;

    const h =
        canvas.height;

    const min =
        Math.min(...values);

    const max =
        Math.max(...values);

    const range =
        max - min || 1;

    ctx.clearRect(
        0,0,w,h
    );

    ctx.beginPath();

    values.forEach(
        (value,index) => {

            const x =
                index /
                (values.length - 1)
                * (w - 6) + 3;

            const y =
                h - 3 -
                (
                    (value - min) /
                    range
                )
                * (h - 6);

            if (index === 0) {
                ctx.moveTo(x,y);
            } else {
                ctx.lineTo(x,y);
            }

        }
    );

    ctx.strokeStyle =
        change >= 0
            ? "#24d79a"
            : "#f25b68";

    ctx.lineWidth = 2;
    ctx.stroke();
}

function formatPrice(value) {

    const n =
        Number(value);

    if (!Number.isFinite(n)) {
        return "--";
    }

    if (n >= 1000) {
        return "$" +
            n.toLocaleString(
                undefined,
                {
                    minimumFractionDigits:2,
                    maximumFractionDigits:2
                }
            );
    }

    if (n >= 1) {
        return "$" +
            n.toFixed(4);
    }

    if (n >= 0.01) {
        return "$" +
            n.toFixed(5);
    }

    return "$" +
        n.toFixed(8);
}

function formatChange(value) {

    if (!Number.isFinite(value)) {
        return "--";
    }

    return (
        value >= 0
            ? "+"
            : ""
    ) +
    value.toFixed(2) +
    "%";
}

function formatVolume(value) {

    const n =
        Number(value);

    if (!Number.isFinite(n)) {
        return "--";
    }

    if (n >= 1e9) {
        return "$" +
            (n / 1e9)
                .toFixed(2) +
            "B";
    }

    if (n >= 1e6) {
        return "$" +
            (n / 1e6)
                .toFixed(2) +
            "M";
    }

    return "$" +
        n.toLocaleString();
}

document
    .getElementById("search")
    .addEventListener(
        "input",
        renderMarkets
    );

document
    .getElementById("spotTab")
    .onclick =
    function () {

        currentMode = "spot";

        document
            .querySelectorAll(".tab")
            .forEach(
                x =>
                    x.classList
                        .remove("active")
            );

        this.classList.add("active");

        renderMarkets();
    };

document
    .getElementById("favTab")
    .onclick =
    function () {

        currentMode =
            "favorites";

        document
            .querySelectorAll(".tab")
            .forEach(
                x =>
                    x.classList
                        .remove("active")
            );

        this.classList.add("active");

        renderMarkets();
    };

document
    .getElementById(
        "derivativesTab"
    )
    .onclick =
    function () {

        alert(
            "Demo derivatives market will be added later."
        );
    };

loadMarkets();

setInterval(
    loadMarkets,
    60000
);

</script>
