<script>
/* ===== Customer authentication gate ===== */
window.__customerAuthReady = (async function () {
  const authClient = window.supabase.createClient(
    "https://cyvquivolvkxzcseyhvk.supabase.co",
    "sb_publishable_dy2_qtfTrOjeD-kPKohHiQ_zKHxZEHU"
  );

  const { data, error } = await authClient.auth.getSession();

  if (error || !data || !data.session || !data.session.user) {
    window.location.replace("login.html");
    return false;
  }

  const user = data.session.user;
  const { data: profile, error: profileError } = await authClient
    .from("customer_profiles")
    .select("uid,email,account_score")
    .eq("auth_user_id", user.id)
    .single();

  if (profileError || !profile || !profile.uid) {
    await authClient.auth.signOut();
    window.location.replace("login.html");
    return false;
  }

  localStorage.setItem("demoUid", profile.uid);
  localStorage.setItem("demoCustomerUid", profile.uid);
  localStorage.setItem("customerEmail", profile.email || user.email || "");
  localStorage.setItem("demoAccountScore", String(profile.account_score ?? 100));

  window.customerAuth = { client: authClient, user, profile };
  document.documentElement.classList.add("auth-ready");
  return true;
})();
</script>

<script>

const SUPABASE_URL =
  'https://cyvquivolvkxzcseyhvk.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_dy2_qtfTrOjeD-kPKohHiQ_zKHxZEHU';


let allNews = [];

let activeFilter = 'ALL';


function esc(value){

  return String(value ?? '')

    .replace(/&/g,'&amp;')

    .replace(/</g,'&lt;')

    .replace(/>/g,'&gt;')

    .replace(/"/g,'&quot;')

    .replace(/'/g,'&#39;');

}


function safeUrl(value){

  try{

    const u =
      new URL(
        String(value || '')
      );

    if(
      u.protocol === 'http:' ||
      u.protocol === 'https:'
    ){

      return u.href;

    }

  }catch(_){}

  return '#';

}


function formatDate(value){

  if(!value){
    return '';
  }

  const d =
    new Date(value);

  if(
    Number.isNaN(
      d.getTime()
    )
  ){
    return '';
  }

  const now =
    Date.now();

  const diff =
    now - d.getTime();

  const minute =
    60 * 1000;

  const hour =
    60 * minute;

  const day =
    24 * hour;


  if(
    diff >= 0 &&
    diff < minute
  ){

    return 'Just now';

  }


  if(
    diff >= 0 &&
    diff < hour
  ){

    return (
      Math.max(
        1,
        Math.floor(
          diff / minute
        )
      ) +
      'm ago'
    );

  }


  if(
    diff >= 0 &&
    diff < day
  ){

    return (
      Math.floor(
        diff / hour
      ) +
      'h ago'
    );

  }


  if(
    diff >= 0 &&
    diff < 7 * day
  ){

    return (
      Math.floor(
        diff / day
      ) +
      'd ago'
    );

  }


  return d.toLocaleDateString(
    undefined,
    {
      year:'numeric',
      month:'short',
      day:'numeric'
    }
  );

}


function goBack(){

  if(
    document.referrer &&
    document.referrer.includes(
      location.hostname
    )
  ){

    history.back();

  }else{

    location.href =
      'index.html';

  }

}


function renderNews(){

  const list =
    document.getElementById(
      'newsList'
    );

  const search =
    String(
      document.getElementById(
        'searchInput'
      ).value || ''
    )
    .trim()
    .toLowerCase();


  const rows =
    allNews.filter(
      item => {

        const title =
          String(
            item.title || ''
          ).toLowerCase();

        const summary =
          String(
            item.summary || ''
          ).toLowerCase();

        const coin =
          String(
            item.coin_symbol || ''
          ).toUpperCase();

        const category =
          String(
            item.category || ''
          ).toUpperCase();

        const source =
          String(
            item.source_name || ''
          ).toLowerCase();


        const matchesSearch =

          !search ||

          title.includes(
            search
          ) ||

          summary.includes(
            search
          ) ||

          coin
            .toLowerCase()
            .includes(
              search
            ) ||

          category
            .toLowerCase()
            .includes(
              search
            ) ||

          source.includes(
            search
          );


        let matchesFilter =
          true;


        if(
          activeFilter ===
          'BTC'
        ){

          matchesFilter =
            coin === 'BTC';

        }

        else if(
          activeFilter ===
          'ETH'
        ){

          matchesFilter =
            coin === 'ETH';

        }

        else if(
          activeFilter ===
          'SOL'
        ){

          matchesFilter =
            coin === 'SOL';

        }

        else if(
          activeFilter ===
          'XRP'
        ){

          matchesFilter =
            coin === 'XRP';

        }

        else if(
          activeFilter ===
          'MARKET'
        ){

          matchesFilter =
            category ===
            'MARKET';

        }

        else if(
          activeFilter ===
          'REGULATION'
        ){

          matchesFilter =
            category ===
            'REGULATION';

        }


        return (
          matchesSearch &&
          matchesFilter
        );

      }
    );


  if(
    rows.length === 0
  ){

    list.innerHTML =

      '<div class="state-card">' +

        '<div class="state-title">' +
          'No news found' +
        '</div>' +

        '<div class="state-sub">' +
          'Try another search or category.' +
        '</div>' +

      '</div>';

    return;

  }


  list.innerHTML =

    rows.map(
      item => {

        const url =
          safeUrl(
            item.source_url
          );

        const image =
          safeUrl(
            item.image_url
          );

        const hasImage =
          image !== '#';


        const coin =

          item.coin_symbol

            ?

            '<span class="meta-pill coin-pill">' +

              esc(
                item.coin_symbol
              ) +

            '</span>'

            :

            '';


        const category =

          item.category

            ?

            '<span class="meta-pill">' +

              esc(
                item.category
              ) +

            '</span>'

            :

            '';


        const source =

          item.source_name

            ?

            '<span>' +

              esc(
                item.source_name
              ) +

            '</span>'

            :

            '';


        const imageHtml =

          hasImage

            ?

            '<div class="news-image-wrap">' +

              '<img ' +

                'class="news-image" ' +

                'src="' +
                  esc(image) +
                '" ' +

                'alt="" ' +

                'loading="lazy" ' +

                'onerror="this.parentElement.style.display=\'none\'"' +

              '>' +

            '</div>'

            :

            '';


        return (

          '<a ' +

            'class="news-card ' +
              (
                hasImage
                  ?
                  'with-image'
                  :
                  ''
              ) +
            '" ' +

            'href="' +
              esc(url) +
            '" ' +

            'target="_blank" ' +

            'rel="noopener noreferrer"' +

          '>' +


            imageHtml +


            '<div class="news-body">' +


              '<div class="news-meta">' +

                coin +

                category +

                source +

              '</div>' +


              '<h2 class="news-title">' +

                esc(
                  item.title ||
                  'Untitled news'
                ) +

              '</h2>' +


              (
                item.summary

                  ?

                  '<div class="news-summary">' +

                    esc(
                      item.summary
                    ) +

                  '</div>'

                  :

                  ''
              ) +


              '<div class="news-footer">' +

                '<span>' +

                  esc(
                    formatDate(
                      item.published_at
                    )
                  ) +

                '</span>' +

                '<span class="read-more">' +

                  'Read article →' +

                '</span>' +

              '</div>' +


            '</div>' +


          '</a>'

        );

      }
    )
    .join('');

}


async function loadNews(){

  const list =
    document.getElementById(
      'newsList'
    );

  const loading =
    document.getElementById(
      'loadingLine'
    );


  loading.classList.add(
    'show'
  );


  try{

    const fields = [

      'id',

      'title',

      'summary',

      'source_name',

      'source_url',

      'image_url',

      'coin_symbol',

      'category',

      'published_at',

      'is_featured',

      'is_active'

    ].join(',');


    const url =

      SUPABASE_URL +

      '/rest/v1/crypto_news?select=' +

      encodeURIComponent(
        fields
      ) +

      '&is_active=eq.true' +

      '&order=published_at.desc' +

      '&limit=100';


    const response =
      await fetch(
        url,
        {
          headers:{

            apikey:
              SUPABASE_KEY,

            Authorization:
              'Bearer ' +
              SUPABASE_KEY

          },

          cache:
            'no-store'

        }
      );


    if(
      !response.ok
    ){

      const text =
        await response.text();

      throw new Error(
        text ||
        'Failed to load news'
      );

    }


    const rows =
      await response.json();


    allNews =
      Array.isArray(
        rows
      )
        ?
        rows
        :
        [];


    renderNews();

  }

  catch(error){

    console.error(
      'News loading error:',
      error
    );


    list.innerHTML =

      '<div class="state-card">' +

        '<div class="state-title">' +

          'Unable to load news' +

        '</div>' +

        '<div class="state-sub">' +

          'Please check your connection and try again.' +

        '</div>' +

        '<button ' +

          'class="refresh-btn" ' +

          'onclick="loadNews()"' +

        '>' +

          'Try Again' +

        '</button>' +

      '</div>';

  }

  finally{

    loading.classList.remove(
      'show'
    );

  }

}


document
  .getElementById(
    'searchInput'
  )
  .addEventListener(
    'input',
    renderNews
  );


document
  .getElementById(
    'filterRow'
  )
  .addEventListener(
    'click',
    event => {

      const button =
        event.target.closest(
          '.filter-btn'
        );


      if(
        !button
      ){
        return;
      }


      activeFilter =
        button.dataset.filter ||
        'ALL';


      document
        .querySelectorAll(
          '.filter-btn'
        )
        .forEach(
          btn => {

            btn.classList.toggle(
              'active',
              btn === button
            );

          }
        );


      renderNews();

    }
  );


loadNews();

/* refresh data every 60 seconds */

setInterval(
  loadNews,
  60000
);

</script>
